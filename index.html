/* Estrae l'ID video da qualsiasi formato di link YouTube (o da un ID nudo). */
function extractVideoId(input) {
  if (!input) return null;
  const raw = input.trim();
  if (/^[\w-]{11}$/.test(raw)) return raw;
  let url;
  try {
    url = new URL(/^https?:\/\//i.test(raw) ? raw : "https://" + raw);
  } catch {
    return null;
  }
  const host = url.hostname.replace(/^(www\.|m\.|music\.)/, "");
  let id = null;
  if (host === "youtu.be") {
    id = url.pathname.split("/")[1];
  } else if (host === "youtube.com" || host === "youtube-nocookie.com") {
    if (url.pathname === "/watch") id = url.searchParams.get("v");
    else {
      const m = url.pathname.match(/^\/(embed|shorts|live|v|e)\/([\w-]{11})/);
      if (m) id = m[2];
    }
  }
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}

const fmt = (s) => {
  const t = Math.max(0, Math.floor(s || 0));
  return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
};

/* ================= LINK PAGELLA (Base64 URL-safe, UTF-8) ================= */
function toBase64Url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromBase64Url(b64) {
  let s = b64.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* Genera ID breve (6 caratteri) e salva su Supabase nella stessa tabella volley_sync */
function shortCode() {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function basePageUrl() {
  return window.location.protocol === "file:"
    ? window.location.href.split("#")[0]

}
async function saveShortPayload(prefix, payload) {
  if (!supabaseClient) return null;
  try {
    const code = shortCode();
    const id = prefix + "_" + code;
    const now = new Date().toISOString();
    const { error } = await supabaseClient.from(CLOUD_TABLE).upsert({
      id,
      data: { kind: prefix, payload, createdAt: now },
      updated_at: now,
    });
    if (error) return null;
    return code;
  } catch (e) {
    return null;
  }
}
async function loadShortPayload(prefix, code) {
  if (!supabaseClient || !/^[a-z0-9]{4,12}$/i.test(code || "")) return null;
  try {
    const { data: row, error } = await supabaseClient
      .from(CLOUD_TABLE)
      .select("data")
      .eq("id", prefix + "_" + code.toLowerCase())
      .maybeSingle();
    if (error || !row || !row.data || !row.data.payload) return null;
    return row.data.payload;
  } catch (e) {
    return null;
  }
}
function parseReportObj(d) {
  if (!d || typeof d !== "object") return { error: true };
  const actions = (Array.isArray(d.a) ? d.a : [])
    .map((x, i) => ({ id: i, time: Math.max(0, Number(x[0]) || 0), skill: SKILLS[x[1]], result: x[2] }))
    .filter((a) => a.skill && RESULT_TEXT[a.result])
    .sort((a, b) => a.time - b.time);
  const vt = parseFloat(d.vt);
  return {
    number: d.n,
    name: String(d.nm || "Giocatore"),
    role: String(d.r || ""),
    voto: isNaN(vt) ? null : vt,
    forza: String(d.f || ""),
    consiglio: String(d.c || ""),
    videoId: /^[\w-]{11}$/.test(d.vid || "") ? d.vid : null,
    actions,
  };
}
function parseMatchObj(d) {
  if (!d || !Array.isArray(d.p)) return { error: true };
  const vid = /^[\w-]{11}$/.test(d.vid || "") ? d.vid : null;
  return {
    players: d.p.map((x, i) => {
      const vt = parseFloat(x.vt), k = Array.isArray(x.k) ? x.k : [];
      return {
        id: i, number: x.n, name: String(x.nm || "Giocatore"), role: String(x.r || ""), voto: isNaN(vt) ? null : vt,
        forza: String(x.f || ""), consiglio: String(x.c || ""), videoId: vid,
        kpi: k.length ? { n: k[0], tpi: k[1], net: k[2], ret: k[3], pps: k[4], res: k[5], qr: k[6], conv: k[7], setter: k[8] === 1 } : null,
        actions: (Array.isArray(x.a) ? x.a : []).map((y, j) => ({ id: j, time: Math.max(0, Number(y[0]) || 0), skill: SKILLS[y[1]], result: y[2] })).filter((a) => a.skill && RESULT_TEXT[a.result]).sort((a, b) => a.time - b.time),
      };
    }),
  };
}

/* lineup[i] = giocatore in Zona i+1. Il Libero sostituisce i "partner" in seconda linea (Z1, Z5, Z6). */
function effLineup(g) {
  const base = g.lineup.length === 6 ? g.lineup.slice() : [null, null, null, null, null, null];
  const L = g.libero || {};
  const eff = base.slice();
  let libIdx = -1;
  if (L.id && !base.includes(L.id) && g.libMan !== "out") {
    const ok = (i) => (L.partners || []).includes(base[i]) && !(i === 0 && g.serving && L.mode === "after");
    const f = [5, 4, 0].find(ok);
    libIdx = f === undefined ? -1 : f;
    if (libIdx < 0 && g.libMan === "in") libIdx = 5;
  }
  if (libIdx >= 0) eff[libIdx] = L.id;
  return { base, eff, libIdx };
}

/* Giocatori con azioni + quelli entrati in campo senza tag (es. Libero). rid = id roster. */
function fullStats(roster, stats, kpi) {
  const out = stats.map((p) => { const r = roster.find((x) => x.number === p.number && x.name === p.name); return { ...p, rid: r ? r.id : null }; });
  roster.forEach((r) => {
    const k = r.number + "|" + r.name;
    if (!out.some((p) => p.key === k) && kpi.pl[k] && kpi.pl[k].n > 0) out.push({ key: k, number: r.number, name: r.name, role: r.role, rid: r.id, raw: {}, skills: [], actions: [], total: derive(emptyCounts()) });
  });
  return out.sort((a, b) => a.number - b.number);
}

/* ================= STATISTICHE & REPORT ================= */
const ROLE_FOCUS = {
  Palleggiatore: "Qualità/Efficienza di Alzata (peso maggiore), Difesa, Battuta, Saldo ± e rendimento nelle rotazioni P1–P6 (NIENTE TPI, niente Muro)",
  Schiacciatore: "Attacco (peso maggiore), Ricezione, Battuta, Difesa",
  Opposto: "Attacco (peso maggiore), Battuta, Muro",
  Centrale: "Attacco, Muro, Battuta (Ricezione e Difesa non contano)",
  Libero: "SOLO Ricezione e Difesa (Attacco, Battuta, Muro e Alzata non contano)",
};

const emptyCounts = () => ({ "#": 0, "+": 0, "-": 0, "/": 0, "=": 0, tot: 0 });
const isSetter = (role) => String(role || "").trim().toLowerCase() === "palleggiatore";
const pct = (n, d) => (d ? Math.round((n / d) * 100) : null);
const derive = (c) => ({ ...c, pos: pct(c["#"] + c["+"], c.tot), eff: pct(c["#"] - c["="] - 0.5 * c["/"], c.tot) });
const pctTxt = (v) => (v === null ? "–" : v + "%");

/* Filtro per set: setNo = "all" / null (tutta la partita) oppure il numero del set (1-5) */
const inSet = (x, setNo) => setNo == null || setNo === "all" || (x.set || 1) === setNo;

function computeStats(actions, setNo) {
  const map = new Map();
  actions.forEach((a) => {
    if (!inSet(a, setNo)) return;
    const key = a.number + "|" + a.name;
    if (!map.has(key)) map.set(key, { key, number: a.number, name: a.name, role: a.role, raw: {}, total: emptyCounts(), actions: [] });
    const p = map.get(key);
    p.role = a.role;
    if (!p.raw[a.skill]) p.raw[a.skill] = emptyCounts();
    [p.raw[a.skill], p.total].forEach((c) => { c[a.result] += 1; c.tot += 1; });
    p.actions.push(a);
  });
  return Array.from(map.values())
    .map((p) => ({
      ...p,
      skills: SKILLS.filter((s) => p.raw[s]).map((s) => ({ skill: s, ...derive(p.raw[s]) })),
      total: derive(p.total),
    }))
    .sort((a, b) => a.number - b.number);
}

function computeKpi(rallies, actions, setNo) {
  if (setNo != null && setNo !== "all") {
    rallies = rallies.filter((r) => inSet(r, setNo));
    actions = actions.filter((a) => inSet(a, setNo));
  }
  const rot = {};
  for (let i = 1; i <= 6; i++) rot[i] = { n: 0, w: 0, l: 0, soN: 0, soW: 0, bpN: 0, bpW: 0 };
  const pl = {};
  const P = (k) => pl[k] || (pl[k] = { n: 0, net: 0, sets: new Set(), tN: 0, tW: 0, tS: 0, alN: 0, alW: 0 });
  rallies.forEach((r) => {
    const x = rot[r.rot] || rot[1];
    x.n++; r.won ? x.w++ : x.l++;
    if (r.serving) { x.bpN++; if (r.won) x.bpW++; } else { x.soN++; if (r.won) x.soW++; }
    r.lineup.forEach((k) => { const p = P(k); p.n++; p.net += r.won ? 1 : -1; p.sets.add(r.set); });
    const by = {};
    actions.forEach((a) => {
      if (a.rallyId !== r.id) return;
      const o = by[a.number + "|" + a.name] || (by[a.number + "|" + a.name] = { e: false, m: false, al: false });
      if (a.result === "=") o.e = true;
      if (a.result === "/") o.m = true;
      if (a.skill === "Alzata" && (a.result === "#" || a.result === "+")) o.al = true;
    });
    Object.keys(by).forEach((k) => {
      const p = P(k), o = by[k];
      p.tN++; if (r.won) p.tW++;
      p.tS += r.won ? 1 : o.e ? -1 : o.m ? -0.5 : 0; /* scambio perso: = pesa -1, / pesa -0,5 */
      if (o.al) { p.alN++; if (r.won) p.alW++; }
    });
  });
  return { rot, pl };
}
function playerKpi(p, k, setNo) {
  k = k || { n: 0, net: 0, sets: new Set(), tN: 0, tW: 0, tS: 0, alN: 0, alW: 0 };
  const f = setNo != null && setNo !== "all";
  const acts = f ? p.actions.filter((a) => inSet(a, setNo)) : p.actions;
  let total = p.total, al = (p.skills || []).find((s) => s.skill === "Alzata");
  if (f) { /* con filtro set ricalcolo totali e Alzata solo sulle azioni di quel set */
    const t = emptyCounts(), a2 = emptyCounts();
    acts.forEach((a) => { t[a.result] += 1; t.tot += 1; if (a.skill === "Alzata") { a2[a.result] += 1; a2.tot += 1; } });
    total = derive(t); al = a2.tot ? derive(a2) : undefined;
  }
  const pts = acts.filter((a) => a.result === "#" && ["Attacco", "Battuta", "Muro"].includes(a.skill)).length;
  /* Resilienza: si attiva dopo = o -; i "/" sono ignorati; recupero = azione successiva # o + */
  const sorted = acts.filter((a) => a.result !== "/").sort((a, b) => a.time - b.time);
  let errs = 0, ok = 0;
  sorted.forEach((a, i) => { if ((a.result === "=" || a.result === "-") && sorted[i + 1]) { errs++; if (sorted[i + 1].result === "#" || sorted[i + 1].result === "+") ok++; } });
  const setter = isSetter(p.role);
  return {
    n: k.n, setEq: (k.n / SET_EQ).toFixed(1), setter, tpi: setter ? null : pct(k.tS, k.tN), qr: al ? al.pos : null, conv: pct(k.alW, k.alN), net: k.net,
    ret: pct(total.tot - total["="], total.tot),
    pps: (pts / Math.max(1, k.sets.size)).toFixed(1), res: pct(ok, errs),
  };
}
const kpiTxt = (v) => "Minutaggio " + v.n + " scambi, TPI " + pctTxt(v.tpi) + ", Saldo " + (v.net > 0 ? "+" : "") + v.net;

function playerDataText(p) {
  const parts = p.skills.map(
    (s) => `${s.skill} ${s.tot} (#${s["#"]} +${s["+"]} -${s["-"]} =${s["="]}, pos ${pctTxt(s.pos)}, eff ${pctTxt(s.eff)})`
  );
  return `n.${p.number} ${p.name} | ${p.role} | tocchi ${p.total.tot} | ${parts.join("; ")}`;
}

function matchDataText(stats) {

  ];
  Array.from(new Set(ps.map((p) => p.role))).forEach((r) => L.push("- " + r + ": " + (ROLE_FOCUS[r] || "tutti")));

  }

    const v = kpiFn(p);

    L.push("  Statistiche: " + (p.skills.length ? p.skills.map((s) => `${s.skill} ${s.tot} (#${s["#"]} +${s["+"]} -${s["-"]} =${s["="]}, Pos ${pctTxt(s.pos)}, Eff ${pctTxt(s.eff)})`).join("; ") : "nessuna azione taggata"));
    L.push(`  Murati / Merito Avversario (/): ${p.total["/"]} | Errori diretti (=): ${p.total["="]}  [i / NON penalizzano il voto]`);
    const rest = `Net ± ${v.net > 0 ? "+" : ""}${v.net} | Ball Retention ${pctTxt(v.ret)} | Punti/Set ${v.pps} | Resilienza ${pctTxt(v.res)}`;
    L.push("  KPI: " + (v.setter ? `Qualità Regia (# + +) ${pctTxt(v.qr)} | Conversione Punti su Alzata ${pctTxt(v.conv)} | ` : `TPI ${pctTxt(v.tpi)} | `) + rest);
    if (v.setter) {
      const rr = [];
      for (let n = 1; n <= 6; n++) { const w = rallies.filter((r) => r.rot === n && r.lineup.includes(p.key)); if (w.length) { const s = w.filter((r) => r.won).length * 2 - w.length; rr.push(`P${n} ${s > 0 ? "+" : ""}${s} (${w.length} scambi)`); } }
      L.push("  Saldo per rotazione con lui in campo: " + (rr.join("; ") || "n/d"));
    }
    const errs = p.actions.filter((a) => a.result === "=").sort((a, b) => a.time - b.time);

  });
  L.push("", 'Rispondi ESCLUSIVAMENTE con un JSON valido (nessun testo extra, nessun markdown), usando come chiave l\'ID indicato tra [ID ...]:', '{ "ID_GIOCATORE": { "voto": 7.5, "forza": "...", "consiglio": "..." } }');
  return L.join("\n");
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext !== false) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

const toneOf = (v, kind) => {
  if (v === null || v === undefined || isNaN(v)) return "slate";
  const t = THRESH[kind] || THRESH.pos;
  return v >= t[0] ? "emerald" : v >= t[1] ? "sky" : v >= t[2] ? "amber" : "rose";
};
const sgn = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
const DIST = [["#", "bg-emerald-500"], ["+", "bg-sky-500"], ["-", "bg-amber-400"], ["/", "bg-violet-500"], ["=", "bg-rose-500"]];
const cardCls = "rounded-xl border border-slate-800 bg-slate-900 p-4";

function Bar({ v, kind, tone, h }) {
  const t = TONE[tone || toneOf(v, kind)];
  const w = v === null || v === undefined || isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
  return (
    <div className={"w-full overflow-hidden rounded-full bg-slate-800 " + (h || "h-2.5")}>
      <div className={"h-full rounded-full transition-all " + t.bar} style={{ width: w + "%" }} />
    </div>
  );
}

function KpiCard({ icon, label, value, bar, kind, tone, hint }) {
  const t = TONE[tone || toneOf(bar, kind)];
  return (
    <div className="flex flex-col gap-2 rounded-xl border border-slate-800 bg-slate-900 p-3">
      <div className="flex items-center gap-1 text-xs font-semibold text-slate-400"><span>{icon}</span>{label}</div>
      <div className={"text-3xl font-black tabular-nums " + t.text}>{value}</div>
      {bar !== undefined && <Bar v={bar} kind={kind} tone={tone} />}
      <p className="text-[11px] leading-snug text-slate-400">{hint}</p>
    </div>
  );
}

function Delta({ d, dec, inv }) {
  if (d === null || d === undefined || isNaN(d)) return null;
  const k = Math.pow(10, dec || 0);
  const r = Math.round(d * k) / k;
  if (r === 0) return <span className="ml-1 text-[10px] text-slate-500">=</span>;
  const good = inv ? r < 0 : r > 0;
  return <span className={"ml-1 text-[10px] font-bold " + (good ? "text-emerald-400" : "text-rose-400")}>{r > 0 ? "+" : "−"}{Math.abs(r).toFixed(dec || 0)}</span>;
}

/* Grafico a linee SVG nativo (nessuna libreria). mode: pct | grade | auto0 */
function LineChart({ labels, series, mode, avg }) {
  const W = 640, H = 260, L = 42, R = 16, T = 14, B = 34;
  const vals = [];
  series.forEach((s) => s.values.forEach((v) => { if (v !== null && v !== undefined && !isNaN(v)) vals.push(v); }));
  if (!vals.length) return <p className="p-4 text-center text-sm text-slate-400">Nessun dato da mostrare.</p>;
  const mn = Math.min.apply(null, vals.concat(avg != null ? [avg] : []));
  const mx = Math.max.apply(null, vals.concat(avg != null ? [avg] : []));
  let lo, hi;
  if (mode === "pct") { lo = Math.min(0, Math.floor(mn / 10) * 10); hi = 100; }
  else if (mode === "grade") { lo = 4; hi = 10; }
  else { lo = 0; hi = Math.max(2, Math.ceil(mx * 1.2)); }
  const n = labels.length;
  const X = (i) => (n === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (n - 1));
  const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [0, 1, 2, 3, 4].map((i) => lo + (i * (hi - lo)) / 4);
  const tk = (v) => (hi - lo <= 10 ? (Math.round(v * 10) / 10).toString() : Math.round(v).toString());
  const showVals = series.length === 1 && n <= 10;
  return (
    <div>
      <svg viewBox={"0 0 " + W + " " + H} className="w-full" role="img" aria-label="Grafico andamento">
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={L} x2={W - R} y1={Y(t)} y2={Y(t)} stroke={t === 0 && lo < 0 ? "#64748b" : "#1e293b"} strokeWidth={t === 0 && lo < 0 ? 1.5 : 1} />
            <text x={L - 6} y={Y(t) + 4} textAnchor="end" fontSize="11" fill="#94a3b8">{tk(t)}</text>
          </g>
        ))}
        {labels.map((lb, i) => (
          <text key={i} x={X(i)} y={H - 12} textAnchor="middle" fontSize="11" fill="#94a3b8">{lb}</text>
        ))}
        {avg != null && (
          <g>
            <line x1={L} x2={W - R} y1={Y(avg)} y2={Y(avg)} stroke="#f97316" strokeWidth="1.5" strokeDasharray="5 4" />
            <text x={W - R} y={Y(avg) - 4} textAnchor="end" fontSize="10" fill="#fb923c">media stagione</text>
          </g>
        )}
        {series.map((s) => {
          let d = "", pen = false;
          s.values.forEach((v, i) => {
            if (v === null || v === undefined || isNaN(v)) { pen = false; return; }
            d += (pen ? " L " : " M ") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
            pen = true;
          });
          return (
            <g key={s.name}>
              <path d={d} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
              {s.values.map((v, i) => (v === null || v === undefined || isNaN(v) ? null : (
                <g key={i}>
                  <circle cx={X(i)} cy={Y(v)} r="4.5" fill={s.color} stroke="#0f172a" strokeWidth="1.5"><title>{labels[i] + " · " + s.name + ": " + (Math.round(v * 10) / 10)}</title></circle>
                  {showVals && <text x={X(i)} y={Y(v) - 9} textAnchor="middle" fontSize="11" fontWeight="700" fill={s.color}>{Math.round(v * 10) / 10}</text>}
                </g>
              )))}
            </g>
          );
        })}
      </svg>
      <div className="mt-1 flex flex-wrap justify-center gap-x-4 gap-y-1 text-xs">
        {series.map((s) => (<span key={s.name} className="flex items-center gap-1 text-slate-300"><span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: s.color }} />{s.name}</span>))}
      </div>
    </div>
  );
}

/* Riepilogo di squadra su azioni + scambi (opz. filtrati per set) */
function teamKpi(actions, rallies, setNo) {
  const acts = actions.filter((a) => inSet(a, setNo));
  const rs = rallies.filter((r) => inSet(r, setNo));
  const c = emptyCounts();
  acts.forEach((a) => { if (c[a.result] === undefined) return; c[a.result] += 1; c.tot += 1; });
  const d = derive(c);
  const pts = acts.filter((a) => a.result === "#" && ["Attacco", "Battuta", "Muro"].includes(a.skill)).length;
  let soN = 0, soW = 0, bpN = 0, bpW = 0, w = 0;
  rs.forEach((r) => { if (r.won) w++; if (r.serving) { bpN++; if (r.won) bpW++; } else { soN++; if (r.won) soW++; } });
  return { tot: c.tot, pos: d.pos, eff: d.eff, err: c["="], pts, so: pct(soW, soN), bp: pct(bpW, bpN), soN, soW, bpN, bpW, rn: rs.length, rw: w, rl: rs.length - w };
}

/* Analisi completa di una partita (corrente o d'archivio) per i trend */
function analyzeMatch(m, fbRoster) {
  const d = m.data || {};
  const acts = Array.isArray(d.actions) ? d.actions : [];
  const rs = Array.isArray(d.rallies) ? d.rallies : [];
  const ros = Array.isArray(d.roster) && d.roster.length ? d.roster : fbRoster;
  const team = teamKpi(acts, rs, "all");
  const kp = computeKpi(rs, acts, "all");
  const ps = fullStats(ros, computeStats(acts, "all"), kp);
  const pl = {};
  ps.forEach((p) => {
    const v = playerKpi(p, kp.pl[p.key], "all");
    const rep = (d.reports || {})[p.key];
    pl[p.key] = {
      key: p.key, number: p.number, name: p.name, role: p.role, setter: v.setter,
      played: p.total.tot > 0 || v.n > 0,
      voto: rep && typeof rep.voto === "number" ? rep.voto : null,
      pos: p.total.pos, eff: p.total.eff, main: v.setter ? v.qr : v.tpi,
      pps: parseFloat(v.pps), err: p.total["="],
    };
  });
  return { id: m.id, name: m.name, date: m.date, team, pl };
}
const matchSig = (d) => {
  const a = (d && d.actions) || [], r = (d && d.rallies) || [];
  return a.length + ":" + r.length + ":" + (a.length ? a[a.length - 1].id : 0) + ":" + (r.length ? r[r.length - 1].id : 0);
};
const shortDate = (iso) => { try { return new Date(iso).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" }); } catch (e) { return ""; } };
const mean = (arr) => { const x = arr.filter((v) => v !== null && v !== undefined && !isNaN(v)); return x.length ? x.reduce((s, v) => s + v, 0) / x.length : null; };

                    </tr>))}</tbody>
                </table>
              </div>
            </details>
            <p className="mt-2 text-xs text-slate-400">Side-Out: scambi vinti quando si riceve. Break Point: scambi vinti quando si serve. Saldo ±: punti fatti meno subiti. Più forte / più critica = saldo più alto / più basso (a parità conta la somma di Side-Out e Break Point).</p>
          </div>

          {/* Giocatori */}
          <div className={cardCls}>
            <h2 className="mb-3 text-lg font-bold">Giocatori</h2>
            <div className="mb-3 flex flex-wrap gap-2">
              <button onClick={() => setPlSel("all")} className={"rounded-full px-3 py-1.5 text-sm font-semibold " + (!curRow ? "bg-orange-500 text-slate-950" : "bg-slate-800 hover:bg-slate-700")}>Tutti</button>
              {aPs.map((p) => (
                <button key={p.key} onClick={() => setPlSel(p.key)} className={"rounded-full px-3 py-1.5 text-sm font-semibold " + (curRow && curRow.p.key === p.key ? "bg-orange-500 text-slate-950" : "bg-slate-800 hover:bg-slate-700")}>{p.number} {p.name}</button>
              ))}
            </div>

            {!curRow && (
              <div className="overflow-x-auto">
                <table className="w-full min-w-[720px] text-sm tabular-nums">
                  <thead className="text-xs text-slate-400"><tr>{thB("number", "Giocatore", true)}{thB("n", "Scambi")}{thB("main", "TPI / Regia")}{thB("net", "Saldo ±")}{thB("pos", "Pos %")}{thB("eff", "Eff %")}{thB("err", "Err =")}</tr></thead>
                  <tbody>{sorted.map(({ p, v }) => {
                    const main = v.setter ? v.qr : v.tpi;
                    return (
                      <tr key={p.key} onClick={() => setPlSel(p.key)} className="cursor-pointer border-t border-slate-800 text-right hover:bg-slate-800/60">
                        <td className="p-2 text-left"><span className="font-bold text-orange-300">{p.number}</span> <span className="font-semibold">{p.name}</span> <span className="text-[10px] text-slate-500">{p.role}</span></td>
                        <td className="p-2">{v.n}</td>
                        <td className="p-2"><div className="flex items-center justify-end gap-2"><span className={TONE[toneOf(main, v.setter ? "pos" : "tpi")].text}>{pctTxt(main)}{v.setter && <span className="ml-1 text-[10px] text-slate-500">Regia</span>}</span><div className="w-14"><Bar v={main} kind={v.setter ? "pos" : "tpi"} h="h-2" /></div></div></td>
                        <td className={"p-2 font-bold " + (v.net > 0 ? "text-emerald-400" : v.net < 0 ? "text-rose-400" : "text-slate-400")}>{sgn(v.net)}</td>
                        <td className="p-2"><div className="flex items-center justify-end gap-2"><span className={TONE[toneOf(p.total.pos, "pos")].text}>{pctTxt(p.total.pos)}</span><div className="w-14"><Bar v={p.total.pos} kind="pos" h="h-2" /></div></div></td>
                        <td className="p-2"><div className="flex items-center justify-end gap-2"><span className={TONE[toneOf(p.total.eff, "eff")].text}>{pctTxt(p.total.eff)}</span><div className="w-14"><Bar v={p.total.eff} kind="eff" h="h-2" /></div></div></td>
                        <td className={"p-2 " + (p.total["="] > 0 ? "text-rose-400" : "text-slate-400")}>{p.total["="]}</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
                <p className="mt-2 text-xs text-slate-400">Tocca un giocatore (o il titolo di una colonna per ordinare) per vedere il dettaglio per fondamentale. Il Palleggiatore non ha TPI: al suo posto la Qualità Regia (alzate # e +).</p>
              </div>
            )}

            {curRow && (() => {
              const { p, v } = curRow;
              const tiles = [];
              if (v.setter) {
                tiles.push({ l: "Qualità Regia", val: pctTxt(v.qr), bar: v.qr, kind: "pos", hint: "Alzate # e + sul totale alzate." });
                tiles.push({ l: "Conversione su Alzata", val: pctTxt(v.conv), bar: v.conv, kind: "conv", hint: "Scambi vinti dopo una sua alzata # o +." });
              } else {
                tiles.push({ l: "TPI", val: pctTxt(v.tpi), bar: v.tpi, kind: "tpi", hint: "Scambi vinti +1, persi con suo = −1, con suo / −½." });
              }
              tiles.push({ l: "Saldo ±", val: sgn(v.net), tone: v.net > 0 ? "emerald" : v.net < 0 ? "rose" : "slate", hint: "Scambi vinti meno persi con lui in campo." });
              tiles.push({ l: "Ball Retention", val: pctTxt(v.ret), bar: v.ret, kind: "ret", hint: "Tocchi senza errore diretto." });
              tiles.push({ l: "Punti / Set", val: v.pps, tone: "sky", hint: "Punti # tra attacco, battuta e muro per set." });
              tiles.push({ l: "Resilienza", val: pctTxt(v.res), bar: v.res, kind: "res", hint: "Azioni # o + subito dopo un = o un −." });
              tiles.push({ l: "Minutaggio", val: v.n, tone: "slate", hint: "Scambi in campo (≈ " + v.setEq + " set eq.)." });
              return (
                <div className="space-y-4">
                  <div className="flex items-center gap-3">
                    <div className="flex h-14 w-14 items-center justify-center rounded-xl bg-slate-800 text-3xl font-extrabold text-orange-300">{p.number}</div>
                    <div className="min-w-0 flex-1">
                      <div className="truncate text-xl font-bold">{p.name}</div>
                      <div className="text-sm text-slate-400">{p.role} · {p.total.tot} tocchi · Pos {pctTxt(p.total.pos)} · Eff {pctTxt(p.total.eff)}{reports[p.key] ? " · Voto " + reports[p.key].voto.toFixed(1) : ""}</div>
                    </div>
                    <button onClick={() => setPlSel("all")} className="rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700">← Tutti</button>
                  </div>
                  <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
                    {tiles.map((t) => (<KpiCard key={t.l} label={t.l} value={t.val} bar={t.bar} kind={t.kind} tone={t.tone} hint={t.hint} />))}
                  </div>
                  <div>
                    <h3 className="mb-2 text-sm font-bold uppercase tracking-wide text-slate-400">Dettaglio per fondamentale</h3>
                    <div className="grid gap-3 lg:grid-cols-2">
                      {SKILLS.map((sk) => {
                        const s = p.skills.find((x) => x.skill === sk);
                        if (!s) return (
                          <div key={sk} className="rounded-xl border border-slate-800 bg-slate-950/40 p-3 opacity-60"><div className="font-bold">{sk}</div><div className="text-xs text-slate-500">Nessuna azione taggata.</div></div>
                        );
                        return (
                          <div key={sk} className="rounded-xl border border-slate-800 bg-slate-950/40 p-3">
                            <div className="mb-2 flex items-baseline justify-between"><span className="font-bold">{sk}</span><span className="text-xs text-slate-400">{s.tot} tocchi</span></div>
                            <div className="flex h-3 w-full overflow-hidden rounded-full bg-slate-800">
                              {DIST.map(([k, c]) => (s[k] > 0 ? <div key={k} className={c} style={{ width: (s[k] / s.tot) * 100 + "%" }} title={k + " " + s[k]} /> : null))}
                            </div>
                            <div className="mt-1 flex flex-wrap gap-x-3 text-[11px] font-semibold tabular-nums">
                              {DIST.map(([k]) => (<span key={k} className={RESULT_TEXT[k]}>{k} {s[k]}</span>))}
                            </div>
                            <div className="mt-2 grid grid-cols-2 gap-3">
                              <div><div className="mb-1 flex justify-between text-xs"><span className="text-slate-400">Positività</span><b className={TONE[toneOf(s.pos, "pos")].text}>{pctTxt(s.pos)}</b></div><Bar v={s.pos} kind="pos" /></div>
                              <div><div className="mb-1 flex justify-between text-xs"><span className="text-slate-400">Efficienza</span><b className={TONE[toneOf(s.eff, "eff")].text}>{pctTxt(s.eff)}</b></div><Bar v={s.eff} kind="eff" /></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <p className="mt-2 text-xs text-slate-500">Barra a colori: # punto/perfetta · + positiva · − negativa · / murato o merito avversario (non è errore) · = errore.</p>
                  </div>
                </div>
              );
            })()}
          </div>
        </>)}
      </section>
    );
  }

  /* ========== VISTA 2: CONFRONTO PARTITE & TREND ========== */
  const allIds = perMatch.map((m) => m.id);
  const selIds = trSel === "all" ? allIds : trSel.filter((id) => allIds.includes(id));
  const chosen = perMatch.filter((m) => selIds.includes(m.id));
  const toggleMatch = (id) => setTrSel((cur) => { const base = cur === "all" ? allIds : cur; return base.includes(id) ? base.filter((x) => x !== id) : base.concat([id]); });
  const manyLbl = chosen.length > 5;
  const labels = chosen.map((m, i) => (manyLbl ? String(i + 1) : (m.name.length > 12 ? m.name.slice(0, 11) + "…" : m.name)));
  const col = (f) => chosen.map((m) => f(m.team));
  const tRows = [
    { k: "pos", l: "Positività %", c: "#38bdf8" },
    { k: "eff", l: "Efficienza %", c: "#a78bfa" },
    { k: "so", l: "Side-Out %", c: "#34d399" },
    { k: "bp", l: "Break Point %", c: "#fbbf24" },
  ];

  /* giocatori disponibili: tutti quelli che hanno giocato in almeno una partita */
  const plMap = {};
  perMatch.forEach((m) => Object.keys(m.pl).forEach((k) => { if (m.pl[k].played) plMap[k] = { key: k, number: m.pl[k].number, name: m.pl[k].name, setter: m.pl[k].setter }; }));
  const plList = Object.keys(plMap).map((k) => plMap[k]).sort((a, b) => a.number - b.number);
  const trKey = plMap[trPlayer] ? trPlayer : (plList[0] ? plList[0].key : "");
  const isSet = trKey && plMap[trKey].setter;
  const mainLbl = isSet ? "Qualità Regia %" : "TPI %";
  const PM = [
    { k: "voto", l: "Voto", dec: 1, mode: "grade", inv: false },
    { k: "pos", l: "Positività %", dec: 0, mode: "pct", inv: false },
    { k: "eff", l: "Efficienza %", dec: 0, mode: "pct", inv: false },
    { k: "main", l: mainLbl, dec: 0, mode: "pct", inv: false },
    { k: "pps", l: "Punti/Set", dec: 1, mode: "auto0", inv: false },
    { k: "err", l: "Errori (=)", dec: 0, mode: "auto0", inv: true },
  ];
  const metric = PM.find((x) => x.k === trMetric) || PM[1];
  const rowOfP = (m) => { const r = m.pl[trKey]; return r && r.played ? r : null; };
  const seasonAvg = {};
  PM.forEach((x) => { seasonAvg[x.k] = mean(perMatch.map((m) => { const r = rowOfP(m); return r ? r[x.k] : null; })); });
  const nSeason = perMatch.filter((m) => rowOfP(m)).length;
  const fmtV = (v, dec) => (v === null || v === undefined || isNaN(v) ? "–" : Number(v).toFixed(dec));
  const tdc = "p-2 text-right";

  return (
    <section className="mx-auto max-w-[1500px] space-y-4 p-4">
      {head}

      {/* Selettore partite */}
      <div className={cardCls}>
        <div className="mb-2 flex flex-wrap items-center gap-2">
          <h2 className="mr-auto text-lg font-bold">📈 Confronto Partite &amp; Trend</h2>
          <button onClick={() => setTrSel("all")} className={"rounded-full px-3 py-1.5 text-sm font-semibold " + (trSel === "all" ? "bg-orange-500 text-slate-950" : "bg-slate-800 hover:bg-slate-700")}>Tutte le partite salvate</button>
          <button onClick={() => setTrSel([])} className="rounded-full bg-slate-800 px-3 py-1.5 text-sm font-semibold hover:bg-slate-700">Nessuna</button>
        </div>
        {perMatch.length === 0 && <p className="rounded-lg bg-slate-950/40 p-4 text-center text-sm text-slate-400">Nessuna partita disponibile: salva una partita in Archivio Stagione (o tagga la partita corrente) per vedere i trend.</p>}
        <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
          {perMatch.map((m, i) => {
            const on = selIds.includes(m.id);
            return (
              <label key={m.id} className={"flex cursor-pointer items-center gap-3 rounded-lg border p-2 " + (on ? "border-orange-500/70 bg-orange-500/10" : "border-slate-800 bg-slate-950/40")}>
                <input type="checkbox" checked={on} onChange={() => toggleMatch(m.id)} className="h-4 w-4 accent-orange-500" />
                <div className="min-w-0 flex-1">
                  <div className="truncate text-sm font-semibold">{m.name}</div>
                  <div className="text-[11px] text-slate-400">{m.id === "cur" ? "in corso" : shortDate(m.date)} · {m.team.tot} tocchi · {m.team.rn} scambi</div>
                </div>
                <span className="text-xs text-slate-500">#{i + 1}</span>
              </label>
            );
          })}
        </div>
        {matchInfo.dup && <p className="mt-2 text-xs text-slate-400">La partita corrente è già salvata in archivio: non viene contata due volte.</p>}
        <p className="mt-2 text-xs text-slate-400">Ordine cronologico: dalla più vecchia alla più recente (la partita corrente, se non ancora archiviata, è l'ultima). I dati arrivano dall'Archivio Stagione, anche quello sincronizzato dal Cloud.</p>
      </div>

      {chosen.length === 0 && perMatch.length > 0 && <p className="rounded-xl bg-slate-900 p-6 text-center text-slate-400">Spunta almeno una partita per vedere i dati.</p>}

      {chosen.length > 0 && (<>
        <div className={cardCls}>
          <h3 className="mb-2 text-lg font-bold">Trend di squadra</h3>
          {chosen.length < 2 && <p className="mb-2 rounded-lg bg-slate-950/40 p-2 text-xs text-amber-300">Seleziona almeno 2 partite per vedere l'andamento nel tempo.</p>}
          <div className="grid gap-4 xl:grid-cols-3">
            <div className="xl:col-span-2">
              <LineChart labels={labels} mode="pct" series={tRows.map((r) => ({ name: r.l, color: r.c, values: col((t) => t[r.k]) }))} />
            </div>
            <div>
              <div className="mb-1 text-center text-xs font-semibold text-slate-400">Errori diretti (=)</div>
              <LineChart labels={labels} mode="auto0" series={[{ name: "Errori diretti", color: "#fb7185", values: col((t) => t.err) }]} />
            </div>
          </div>
          {manyLbl && (
            <p className="mt-2 text-xs text-slate-400">{chosen.map((m, i) => (i + 1) + " = " + m.name).join(" · ")}</p>
          )}
          <div className="mt-3 overflow-x-auto">
            <table className="w-full min-w-[640px] text-sm tabular-nums">
              <thead className="text-xs text-slate-400"><tr><th className="p-2 text-left">Partita</th><th className={tdc}>Scambi</th><th className={tdc}>Pos %</th><th className={tdc}>Eff %</th><th className={tdc}>Side-Out %</th><th className={tdc}>Break Pt %</th><th className={tdc}>Err =</th></tr></thead>
              <tbody>{chosen.map((m, i) => {
                const pv = i > 0 ? chosen[i - 1].team : null, t = m.team;
                const dl = (k) => (pv && t[k] !== null && pv[k] !== null ? t[k] - pv[k] : null);
                return (
                  <tr key={m.id} className="border-t border-slate-800">
                    <td className="p-2 text-left font-semibold">{i + 1}. {m.name} <span className="text-[11px] font-normal text-slate-500">{m.id === "cur" ? "" : shortDate(m.date)}</span></td>
                    <td className={tdc}>{t.rn}</td>
                    <td className={tdc}><span className={TONE[toneOf(t.pos, "pos")].text}>{pctTxt(t.pos)}</span><Delta d={dl("pos")} /></td>
                    <td className={tdc}><span className={TONE[toneOf(t.eff, "eff")].text}>{pctTxt(t.eff)}</span><Delta d={dl("eff")} /></td>
                    <td className={tdc}><span className={TONE[toneOf(t.so, "so")].text}>{pctTxt(t.so)}</span><Delta d={dl("so")} /></td>
                    <td className={tdc}><span className={TONE[toneOf(t.bp, "bp")].text}>{pctTxt(t.bp)}</span><Delta d={dl("bp")} /></td>
                    <td className={tdc}>{t.err}<Delta d={dl("err")} inv /></td>
                  </tr>
                );
              })}</tbody>
            </table>
            <p className="mt-2 text-xs text-slate-500">I numeri piccoli accanto ai valori sono la variazione rispetto alla partita precedente (verde = miglioramento, rosso = peggioramento; per gli errori meno è meglio).</p>
          </div>
        </div>

        <div className={cardCls}>
          <div className="mb-3 flex flex-wrap items-center gap-2">
            <h3 className="mr-auto text-lg font-bold">Crescita individuale</h3>
            <select value={trKey} onChange={(e) => setTrPlayer(e.target.value)} className="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-orange-400">
              {plList.length === 0 && <option value="">Nessun giocatore</option>}
              {plList.map((p) => (<option key={p.key} value={p.key}>{p.number} · {p.name}</option>))}
            </select>
          </div>
          {!trKey && <p className="text-sm text-slate-400">Nessun giocatore con dati nelle partite disponibili.</p>}
          {trKey && (<>
            <div className="mb-3 flex flex-wrap gap-2">
              {PM.map((x) => (<button key={x.k} onClick={() => setTrMetric(x.k)} className={"rounded-full px-3 py-1.5 text-sm font-semibold " + (metric.k === x.k ? "bg-orange-500 text-slate-950" : "bg-slate-800 hover:bg-slate-700")}>{x.l}</button>))}
            </div>
            {chosen.length < 2 && <p className="mb-2 rounded-lg bg-slate-950/40 p-2 text-xs text-amber-300">Seleziona almeno 2 partite per vedere la curva di crescita.</p>}
            <LineChart labels={labels} mode={metric.mode} avg={seasonAvg[metric.k]} series={[{ name: metric.l, color: "#fb923c", values: chosen.map((m) => { const r = rowOfP(m); return r ? r[metric.k] : null; }) }]} />
            <div className="mt-3 overflow-x-auto">
              <table className="w-full min-w-[680px] text-sm tabular-nums">
                <thead className="text-xs text-slate-400"><tr><th className="p-2 text-left">Partita</th><th className={tdc}>Voto</th><th className={tdc}>Pos %</th><th className={tdc}>Eff %</th><th className={tdc}>{mainLbl}</th><th className={tdc}>Punti/Set</th><th className={tdc}>Err =</th></tr></thead>
                <tbody>
                  {chosen.map((m, i) => {
                    const r = rowOfP(m);
                    return (
                      <tr key={m.id} className="border-t border-slate-800">
                        <td className="p-2 text-left font-semibold">{i + 1}. {m.name}</td>
                        {!r && <td className="p-2 text-right text-xs text-slate-500" colSpan={6}>non in campo / nessun dato</td>}
                        {r && PM.map((x) => (
                          <td key={x.k} className={tdc}>{fmtV(r[x.k], x.dec)}<Delta d={r[x.k] !== null && seasonAvg[x.k] !== null ? r[x.k] - seasonAvg[x.k] : null} dec={x.dec} inv={x.inv} /></td>
                        ))}
                      </tr>
                    );
                  })}
                  <tr className="border-t-2 border-slate-600 bg-slate-950/40 font-bold">
                    <td className="p-2 text-left text-orange-300">Media stagione ({nSeason})</td>
                    {PM.map((x) => (<td key={x.k} className={tdc}>{fmtV(seasonAvg[x.k], x.dec)}</td>))}
                  </tr>
                </tbody>
              </table>
              <p className="mt-2 text-xs text-slate-500">Il delta (+ / −) è rispetto alla media stagionale del giocatore, calcolata sulle {nSeason} partite disponibili in cui è sceso in campo. Il Voto compare solo per le partite con pagella generata. Per il Palleggiatore la colonna è la Qualità Regia, per gli altri il TPI.</p>
            </div>
          </>)}
        </div>
      </>)}
    </section>
  );
}

function VolleyScout() {

  const S = saved.current;

  const [urlInput, setUrlInput] = useState(() => (typeof S.urlInput === "string" ? S.urlInput : ""));
  const [videoId, setVideoId] = useState(() => (typeof S.videoId === "string" && /^[\w-]{11}$/.test(S.videoId) ? S.videoId : null));

  const [playerReady, setPlayerReady] = useState(false);

  const [actions, setActions] = useState(() => (Array.isArray(S.actions) ? S.actions : []));
  const [flash, setFlash] = useState("");

  const hostRef = useRef(null);
  const playerRef = useRef(null);
  const nextId = useRef(
    Math.max(
      100,
      ...((Array.isArray(S.roster) ? S.roster : []).map((x) => Number(x.id) || 0)),
      ...((Array.isArray(S.actions) ? S.actions : []).map((x) => Number(x.id) || 0))
    ) + 1
  );

  const [reports, setReports] = useState(() => (S.reports && typeof S.reports === "object" ? S.reports : {}));
  const [reportCount, setReportCount] = useState(() => Number(S.reportCount) || 0);
  const [toast, setToast] = useState("");
  const [tab, setTab] = useState("scout");
  const [flagNext, setFlagNext] = useState(false);

  const [selZone, setSelZone] = useState(null);
  const [swapFrom, setSwapFrom] = useState(null);
  const [pasteText, setPasteText] = useState("");

  const [cloud, setCloud] = useState({ type: "", text: "" });
  const [rallies, setRallies] = useState(() => (Array.isArray(S.rallies) ? S.rallies : []));

  const copyForChatAI = () => copyWithToast(buildPrompt(ps, kpiData.rot, kpiRow, rallies), "Dati e prompt copiati: incollali su Claude e riporta qui il JSON.", 3500);
  const applyReports = () => {

      const clean = pasteText.replace(/```json|```/gi, "").trim();

      const entries = Array.isArray(obj) ? obj.map((o) => [o && (o.id != null ? o.id : o.numero != null ? o.numero : o.nome), o]) : Object.entries(obj);
      const next = {};

  /* --- Esporta / importa partita (telefono <-> PC) --- */
  const exportMatch = () => download("partita-volleyscout.json", JSON.stringify({ app: "VolleyScout", type: "match", version: 3, exportedAt: new Date().toISOString(), data: snapshot() }, null, 2), "application/json");
  /* --- Cloud Supabase: salva / carica l'intero stato (partita, roster, formazione, pagelle, archivio) --- */
  const hhmm = (d) => new Date(d).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const cloudErr = (e) => {
    const m = String((e && e.message) || e || "");

    if (e && (e.code === "42501" || /row-level security|permission denied/i.test(m))) return "Supabase ha negato l'accesso (controlla le policy RLS di volley_sync).";
    if (e && (e.code === "42P01" || /does not exist|schema cache/i.test(m))) return "Tabella volley_sync non trovata su Supabase.";
    return "Errore cloud: " + m.slice(0, 120);
  };
  const saveCloud = async () => {
    if (!supabaseClient) { setCloud({ type: "err", text: "Libreria Cloud non caricata: serve connessione." }); return; }
    setCloud({ type: "busy", text: "Controllo stato cloud…" });
    try {
      const { data: existing, error: readErr } = await supabaseClient.from(CLOUD_TABLE).select("data, updated_at").eq("id", CLOUD_ID).maybeSingle();
      if (readErr) throw readErr;

      if (existing && existing.data) {
        const remCur = existing.data.current || {};
        const remAct = Array.isArray(remCur.actions) ? remCur.actions.length : 0;
        const remRal = Array.isArray(remCur.rallies) ? remCur.rallies.length : 0;
        const remArch = Array.isArray(existing.data.archive) ? existing.data.archive.length : 0;
        const locAct = actions.length;
        const locRal = rallies.length;
        const locArch = archive.length;
        const whenStr = new Date(existing.updated_at || existing.data.savedAt || Date.now()).toLocaleString("it-IT");

        const localIsEmpty = locAct === 0 && locRal === 0 && locArch === 0;
        const remoteHasData = remAct > 0 || remRal > 0 || remArch > 0;

        if (localIsEmpty && remoteHasData) {
          const okEmpty = window.confirm(
            "⚠️ ATTENZIONE: questo dispositivo è VUOTO (0 azioni, 0 scambi, archivio vuoto), mentre sul Cloud c'è un salvataggio del " + whenStr +
            " (" + remAct + " azioni, " + remRal + " scambi, " + remArch + " partite in archivio).\n\n" +
            "Premi ANNULLA e clicca prima '🔄 Carica da Cloud' per non perdere i dati!\n" +
            "Vuoi davvero sovrascrivere tutto con una partita vuota?"
          );
          if (!okEmpty) { setCloud({ type: "", text: "" }); return; }
        } else if (remoteHasData && (locAct + locRal < remAct + remRal || locArch < remArch)) {
          const okLess = window.confirm(
            "⚠️ Sul Cloud c'è un salvataggio del " + whenStr + " con più dati (" + remAct + " azioni, " + remRal + " scambi, " + remArch +
            " in archivio) rispetto a questo dispositivo (" + locAct + " azioni, " + locRal + " scambi, " + locArch + " in archivio).\n\n" +
            "Vuoi sovrascriverlo comunque? (Verrà creata una copia di backup automatica sul cloud)."
          );
          if (!okLess) { setCloud({ type: "", text: "" }); return; }
        }

        /* Backup automatico della versione precedente prima di sovrascrivere */
        await supabaseClient.from(CLOUD_TABLE).upsert({
          id: CLOUD_ID + "_backup",
          data: { ...existing.data, backedUpAt: new Date().toISOString() },
          updated_at: existing.updated_at || new Date().toISOString(),
        });
      }

      setCloud({ type: "busy", text: "Salvataggio in corso…" });
      const now = new Date().toISOString();
      const { error } = await supabaseClient.from(CLOUD_TABLE).upsert({ id: CLOUD_ID, data: { app: "VolleyScout", version: 4, savedAt: now, current: snapshot(), archive }, updated_at: now });
      if (error) throw error;
      setCloud({ type: "ok", text: "Salvato alle " + hhmm(now) + " (backup OK)" });
    } catch (e) { setCloud({ type: "err", text: cloudErr(e) }); }
  };
  const loadCloud = async () => {
    if (!supabaseClient) { setCloud({ type: "err", text: "Libreria Cloud non caricata: serve connessione." }); return; }
    setCloud({ type: "busy", text: "Caricamento in corso…" });
    try {
      const { data: row, error } = await supabaseClient.from(CLOUD_TABLE).select("data, updated_at").eq("id", CLOUD_ID).maybeSingle();
      if (error) throw error;
      if (!row || !row.data || !row.data.current) { setCloud({ type: "err", text: "Nessun salvataggio trovato sul cloud." }); return; }
      const when = new Date(row.updated_at || row.data.savedAt || Date.now());
      if ((actions.length || rallies.length) && !window.confirm("Caricare il salvataggio cloud del " + when.toLocaleString("it-IT") + "?\n\nLa partita, il roster e le pagelle su questo dispositivo verranno sovrascritti (l'archivio viene sostituito con quello cloud).")) { setCloud({ type: "", text: "" }); return; }
      const d = row.data.current;
      const rs = d.roster && d.roster.length ? d.roster : roster;
      const n = { urlInput: d.urlInput || "", videoId: d.videoId || null, roster: rs, actions: d.actions || [], reports: d.reports || {}, reportCount: d.reportCount || 0, game: mkGame(d.game), rallies: d.rallies || [] };
      const arch = Array.isArray(row.data.archive) ? row.data.archive : archive;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(n)); localStorage.setItem(ARCH_KEY, JSON.stringify(arch)); } catch (e) {}
      setUrlInput(n.urlInput); setVideoId(n.videoId); setRoster(n.roster); setActions(n.actions); setReports(n.reports);
      setReportCount(n.reportCount); setGame(n.game); setRallies(n.rallies); setArchive(arch);
      setSelPlayer(null); setSelSkill(null); setSelZone(null);
      nextId.current = Math.max(nextId.current, ...n.actions.map((x) => Number(x.id) || 0), ...n.rallies.map((x) => Number(x.id) || 0), ...rs.map((x) => Number(x.id) || 0)) + 1;
      setCloud({ type: "ok", text: "Caricato il salvataggio cloud del " + when.toLocaleDateString("it-IT") + " alle " + hhmm(when) });
    } catch (e) { setCloud({ type: "err", text: cloudErr(e) }); }
  };

  /* --- Set, rotazioni, sostituzioni, chiusura scambio --- */
  const setLineupAt = (i, id) => setGame((g) => { const l = (g.lineup.length === 6 ? g.lineup : [null, null, null, null, null, null]).slice(); l[i] = id ? Number(id) : null; return { ...g, lineup: l }; });
  const rotateOnce = (g) => ({ ...g, rot: (g.rot % 6) + 1, libMan: null, lineup: g.lineup.length === 6 ? g.lineup.map((_, i, a) => a[(i + 1) % 6]) : g.lineup });

  const onZoneTap = (z) => { if (swapFrom) { swapZones(swapFrom, z); return; } setSelZone(selZone === z ? null : z); };
  const doSubZone = (z, id) => { setLineupAt(z - 1, id); setSelZone(null); showToast(id ? "Sostituzione effettuata." : "Posizione svuotata."); };
  const setLibero = (patch) => setGame((g) => ({ ...g, libero: { ...g.libero, ...patch } }));
  const togglePartner = (id) => setGame((g) => ({ ...g, libero: { ...g.libero, partners: g.libero.partners.includes(id) ? g.libero.partners.filter((x) => x !== id) : [...g.libero.partners, id] } }));
  const liberoToggle = () => setGame((g) => ({ ...g, libMan: effLineup(g).libIdx >= 0 ? "out" : "in" }));
  const closeRally = (won) => {

    setRallies((rs) => [...rs, { id, set: game.set, rot: game.rot, serving: game.serving, won, lineup: keys, rotated: won && !game.serving && game.auto }]);
    setActions((as) => as.map((a) => (a.rallyId == null ? { ...a, rallyId: id } : a)));
    setGame((g) => { const n = { ...g, serving: won }; return won && !g.serving && g.auto ? rotateOnce(n) : n; });

    /* ripristina battuta e, se il punto aveva fatto ruotare, la rotazione esatta di prima */
    setGame((g) => ({ ...(last.rotated ? rotateBack(g) : g), serving: last.serving, set: last.set || g.set }));
    showToast("Ultimo punto annullato" + (last.rotated ? " e rotazione ripristinata." : "."));
  };
  const setRalliesCur = rallies.filter((r) => (r.set || 1) === game.set);
  const ptsNoi = setRalliesCur.filter((r) => r.won).length;
  const ptsAvv = setRalliesCur.filter((r) => !r.won).length;
  const closeSet = () => {
    if (ptsNoi === 0 && ptsAvv === 0) { showToast("Segna almeno un punto prima di chiudere il set."); return; }
    if (ptsNoi === ptsAvv) { showToast("Il set è in parità (" + ptsNoi + "-" + ptsAvv + "): assegna prima il punto decisivo."); return; }
    const weWon = ptsNoi > ptsAvv;
    if (!window.confirm(`Chiudere il Set ${game.set} sul punteggio ${ptsNoi} - ${ptsAvv} (${weWon ? "vinto da " + game.homeName : "vinto da " + game.awayName}) e passare al Set ${Math.min(5, game.set + 1)}?`)) return;
    setGame((g) => {
      const sw = [Number(g.setsWon[0]) || 0, Number(g.setsWon[1]) || 0];
      if (weWon) sw[0] = Math.min(3, sw[0] + 1);

  };
  const adjustSetsWon = (idx, delta) => {
    setGame((g) => {
      const sw = [Number(g.setsWon[0]) || 0, Number(g.setsWon[1]) || 0];

      return { ...g, setsWon: sw };

  const editTeamName = (side) => {
    const isHome = side === "home";

    setUrlInput(d.urlInput || ""); setVideoId(d.videoId || null); setRoster(d.roster && d.roster.length ? d.roster : roster);

    setGame(mkGame(d.game)); setRallies(d.rallies || []);
    setTab("scout"); showToast("Partita caricata.");
  };
  const exportBackup = () => download("volleyscout-backup.json", JSON.stringify({ app: "VolleyScout", version: 2, exportedAt: new Date().toISOString(), archive, current: snapshot() }, null, 2), "application/json");
  const importBackup = (file) => {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        const list = Array.isArray(d.archive) ? d.archive : [];
        if (d.current && d.current.actions && d.current.actions.length) list.push({ name: "Backup importato", date: d.exportedAt || new Date().toISOString(), data: d.current });

        showToast(list.length + " partite importate.");
      } catch (e) { showToast("File di backup non valido."); }
    };
    fr.readAsText(file);
