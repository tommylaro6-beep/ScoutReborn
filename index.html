                <button key={n} onClick={() => setGame((g) => ({ ...g, rot: n }))} className={`rounded-lg px-3 py-2 font-bold ${game.rot === n ? "bg-sky-500 text-sky-950" : "bg-slate-800"}`}>P{n}</button>
              ))}
              <button onClick={() => setGame(rotateBack)} className="ml-1 rounded-lg bg-slate-700 px-3 py-2 font-bold hover:bg-slate-600">↩️ Indietro (-1)</button>
              <button onClick={() => setGame(rotateOnce)} className="rounded-lg bg-sky-600 px-3 py-2 font-bold text-white hover:bg-sky-500">🔄 Ruota (+1)</button>
              <button onClick={liberoToggle} className={`rounded-lg px-3 py-2 font-bold ${effLineup(game).libIdx >= 0 ? "bg-amber-400 text-amber-950" : "bg-slate-700"}`}>🛡️ Libero {effLineup(game).libIdx >= 0 ? "OUT" : "IN"}</button>
            </div>
            <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-300">
              <label className="flex items-center gap-1"><input type="checkbox" checked={game.auto} onChange={(e) => setGame((g) => ({ ...g, auto: e.target.checked }))} /> Auto-rotazione al cambio palla</label>
              <label className="flex items-center gap-1"><input type="checkbox" checked={game.serving} onChange={(e) => setGame((g) => ({ ...g, serving: e.target.checked }))} /> Battiamo noi</label>
            </div>
            <details className="rounded-lg bg-slate-800 p-3" open>
              <summary className="cursor-pointer text-sm font-semibold">🛡️ Gestione Libero</summary>
              <div className="mt-2 space-y-2 text-sm">
                <select value={game.libero.id || ""} onChange={(e) => setLibero({ id: e.target.value ? Number(e.target.value) : null, partners: game.libero.partners.filter((x) => String(x) !== e.target.value) })} className={`${inputCls} w-full`}>
                  <option value="">Nessun libero</option>
                  {roster.map((r) => <option key={r.id} value={r.id}>{r.number} {r.name}{r.role === "Libero" ? " (Libero)" : ""}</option>)}
                </select>
                <p className="text-xs text-slate-400">Il Libero cambia con:</p>
                <div className="flex flex-wrap gap-2">
                  {roster.filter((r) => r.id !== game.libero.id && r.role !== "Libero").map((r) => (
                    <label key={r.id} className="flex items-center gap-1 rounded-lg bg-slate-700 px-2 py-1"><input type="checkbox" checked={game.libero.partners.includes(r.id)} onChange={() => togglePartner(r.id)} /> {r.number} {r.name}</label>
                  ))}
                </div>
                <div className="flex flex-wrap gap-4 text-xs">
                  <label className="flex items-center gap-1"><input type="radio" name="libmode" checked={game.libero.mode === "after"} onChange={() => setLibero({ mode: "after" })} /> Entra dopo la battuta in Z1</label>
                  <label className="flex items-center gap-1"><input type="radio" name="libmode" checked={game.libero.mode === "now"} onChange={() => setLibero({ mode: "now" })} /> Subito in Z1</label>
                </div>
                <p className="text-xs text-slate-400">In seconda linea (Z1, Z5, Z6) entra il Libero al posto del partner; in Z4 rientra il titolare.</p>
              </div>
            </details>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => closeRally(true)} className="rounded-lg bg-emerald-500 py-3 font-bold text-emerald-950 hover:bg-emerald-400">+ Punto Noi</button>
              <button onClick={() => closeRally(false)} className="rounded-lg bg-rose-500 py-3 font-bold text-rose-950 hover:bg-rose-400">- Punto Avversari</button>
            </div>
            <p className="text-xs text-slate-400">Scambi chiusi: {rallies.length} · {rallies.filter((r) => r.won).length}-{rallies.filter((r) => !r.won).length} <button onClick={undoRally} disabled={!rallies.length} className="ml-2 rounded-lg bg-slate-700 px-3 py-1 text-xs font-semibold text-slate-100 hover:bg-slate-600 disabled:opacity-40">↩️ Annulla ultimo punto</button></p>
          </section>

          {/* Roster editor */}
          {editRoster && (
            <section className="rounded-xl border border-slate-800 bg-slate-900 p-4">
              <h2 className="mb-3 flex items-center gap-2 text-lg font-bold"><Users className="h-5 w-5" /> Roster</h2>
              <div className="space-y-2">
                {roster.map((p) => (
                  <div key={p.id} className="flex flex-wrap gap-2">
                    <input type="number" value={p.number} onChange={(e) => updatePlayer(p.id, { number: Number(e.target.value) })} className={`${inputCls} w-20`} aria-label="Numero maglia" />
                    <input value={p.name} onChange={(e) => updatePlayer(p.id, { name: e.target.value })} className={`${inputCls} min-w-[140px] flex-1`} aria-label="Nome" />
                    <select value={p.role} onChange={(e) => updatePlayer(p.id, { role: e.target.value })} className={inputCls} aria-label="Ruolo">
                      {ROLES.map((r) => <option key={r}>{r}</option>)}
                    </select>
                    <button onClick={() => removePlayer(p.id)} className="rounded-lg bg-slate-800 px-3 text-rose-400 hover:bg-rose-500 hover:text-white" aria-label="Rimuovi giocatore">
                      <X className="h-4 w-4" />
                    </button>
                  </div>
                ))}
              </div>
              <form onSubmit={addPlayer} className="mt-4 flex flex-wrap gap-2 border-t border-slate-800 pt-4">
                <input type="number" placeholder="N°" value={newP.number} onChange={(e) => setNewP({ ...newP, number: e.target.value })} className={`${inputCls} w-20`} />
                <input placeholder="Nome giocatore" value={newP.name} onChange={(e) => setNewP({ ...newP, name: e.target.value })} className={`${inputCls} min-w-[140px] flex-1`} />
                <select value={newP.role} onChange={(e) => setNewP({ ...newP, role: e.target.value })} className={inputCls}>
                  {ROLES.map((r) => <option key={r}>{r}</option>)}
                </select>
                <button className="flex items-center gap-1 rounded-lg bg-orange-500 px-4 py-2 font-semibold text-slate-950 hover:bg-orange-400">
                  <Plus className="h-4 w-4" /> Aggiungi
                </button>
              </form>
            </section>
          )}
        </div>

        {/* Colonna destra: registro */}
        <aside className="flex max-h-[calc(100vh-2rem)] flex-col rounded-xl border border-slate-800 bg-slate-900 lg:sticky lg:top-4">
          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 p-3">
            <h2 className="text-lg font-bold">Registro azioni <span className="text-slate-400">({actions.length})</span></h2>
            <div className="flex gap-2">
              <button onClick={exportCSV} disabled={!actions.length} className="flex items-center gap-1 rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700 disabled:opacity-40">
                <Download className="h-4 w-4" /> CSV
              </button>
              <button onClick={exportJSON} disabled={!actions.length} className="flex items-center gap-1 rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700 disabled:opacity-40">
                <Download className="h-4 w-4" /> JSON
              </button>
            </div>
          </div>
          <div className="flex-1 overflow-auto">
            {actions.length === 0 ? (
              <p className="p-6 text-center text-slate-400">Nessuna azione registrata. Scegli giocatore, fondamentale e valutazione per creare il primo tag.</p>
            ) : (
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-slate-900 text-left text-slate-400">
                  <tr>
                    <th className="p-2">Tempo</th>
                    <th className="p-2">N°</th>
                    <th className="p-2">Giocatore</th>
                    <th className="p-2">Fondamentale</th>
                    <th className="p-2 text-center">Esito</th>
                    <th className="p-2 text-center">⭐</th>
                    <th className="p-2" />
                  </tr>
                </thead>
                <tbody>
                  {actions.map((a) => (
                    <tr
                      key={a.id}
                      onClick={() => jumpTo(a.time)}
                      className="cursor-pointer border-t border-slate-800 hover:bg-slate-800"
                      title="Vai al momento dell'azione"
                    >
                      <td className="p-2 font-mono tabular-nums text-orange-300">{fmt(a.time)}</td>
                      <td className="p-2 font-bold">{a.number}</td>
                      <td className="p-2">{a.name}</td>
                      <td className="p-2">{a.skill}</td>
                      <td className={`p-2 text-center text-xl font-black ${RESULT_TEXT[a.result]}`}>{a.result}</td>
                      <td className="p-2 text-center"><button onClick={(e) => { e.stopPropagation(); toggleFlag(a.id); }} className="text-xl" aria-label="Segna per AI">{a.aiFlag ? "⭐" : "☆"}</button></td>
                      <td className="p-2 text-right">
                        <button
                          onClick={(e) => { e.stopPropagation(); deleteAction(a.id); }}
                          className="rounded p-1 text-slate-400 hover:bg-rose-500 hover:text-white"
                          aria-label="Elimina azione"
                        >
                          <Trash2 className="h-4 w-4" />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </aside>
      </main>

      <section className="mx-auto max-w-[1500px] p-4 pt-0" id="pagelle">
        <div className="rounded-xl border border-slate-800 bg-slate-900 p-4">
          <h2 className="flex items-center gap-2 text-xl font-bold"><ClipboardList className="h-6 w-6 text-orange-400" /> Pagelle &amp; Report</h2>
          <p className="mt-1 text-sm text-slate-400">Nessuna API: copia i dati della partita, incollali su Claude e riporta qui la risposta JSON.</p>
          <div className="mt-4 flex flex-wrap gap-2">
            <button onClick={copyForChatAI} disabled={!ps.length} className="flex items-center gap-2 rounded-lg bg-orange-500 px-4 py-3 font-semibold text-slate-950 hover:bg-orange-400 disabled:opacity-40"><Copy className="h-4 w-4" /> 📋 Copia Dati Partita &amp; Prompt per Claude</button>
            <button onClick={copyMatchLink} disabled={!ps.length} className="flex items-center gap-2 rounded-lg bg-sky-600 px-4 py-3 font-semibold text-white hover:bg-sky-500 disabled:opacity-40"><Link2 className="h-4 w-4" /> 📢 Copia Link Partita per Gruppo Squadra</button>
          </div>
          <div className="mt-4">
            <label className="mb-1 block text-sm font-semibold text-slate-300" htmlFor="pj">📥 Incolla Risposta JSON di Claude</label>
            <textarea id="pj" rows={5} value={pasteText} onChange={(e) => setPasteText(e.target.value)} placeholder='{ "5": { "voto": 7.5, "forza": "...", "consiglio": "..." } }' className={`${inputCls} w-full font-mono text-xs`} />
            <button onClick={applyReports} disabled={!pasteText.trim()} className="mt-2 flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-3 font-semibold text-white hover:bg-emerald-500 disabled:opacity-40"><Sparkles className="h-4 w-4" /> ✨ Applica Pagelle</button>
            {pasteMsg && <p className={`mt-2 rounded-lg p-3 text-sm ${pasteMsg.type === "ok" ? "bg-emerald-950 text-emerald-300" : "bg-rose-950 text-rose-300"}`}>{pasteMsg.text}</p>}
          </div>
          {Object.keys(reports).length > 0 && reportCount !== actions.length && (
            <p className="mt-3 rounded-lg bg-amber-950 p-3 text-sm text-amber-300">Le azioni sono cambiate dopo l'ultima pagella: copia di nuovo i dati e applica un JSON aggiornato.</p>
          )}
        </div>

        {ps.length === 0 ? (
          <p className="p-8 text-center text-slate-400">Nessun giocatore ha ancora azioni o scambi. Fai qualche tag e qui compariranno le pagelle.</p>
        ) : (
          <div className="mt-4 grid gap-4 md:grid-cols-2 xl:grid-cols-3">
            {ps.map((p) => (
              <PlayerCard
                key={p.key}
                p={p}
                report={reports[p.key]}
                videoId={videoId}
                onClip={jumpClip}
                onCopy={() => copyWithToast(whatsappText(p, reports[p.key], videoId), `Report di ${p.name} copiato: incollalo su WhatsApp.`)}
                onLink={() => copyPlayerLink(p)}
                kpi={kpiRow(p)}
              />
            ))}
          </div>
        )}
      </section>
      </>)}
      {tab === "kpi" && <AnalysisDashboard actions={actions} rallies={rallies} roster={roster} reports={reports} archive={archive} game={game} />}
      {tab === "arch" && (
        <section className="mx-auto max-w-[1500px] space-y-3 p-4">
          <div className="flex flex-wrap gap-2">
            <button onClick={saveArchive} disabled={!actions.length} className="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-slate-950 disabled:opacity-40">💾 Salva in Archivio Stagione</button>
            <button onClick={exportBackup} className="rounded-lg bg-slate-800 px-4 py-2 font-semibold hover:bg-slate-700">⬇️ Esporta Backup JSON</button>
            <label className="cursor-pointer rounded-lg bg-slate-800 px-4 py-2 font-semibold hover:bg-slate-700">⬆️ Importa Backup JSON<input type="file" accept="application/json,.json" className="hidden" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} /></label>
          </div>
          <p className="text-xs text-slate-400">La partita corrente si salva da sola in questo browser. Il backup contiene solo i dati di scouting.</p>
          {archive.length === 0 && <p className="rounded-xl bg-slate-900 p-6 text-center text-slate-400">Archivio vuoto.</p>}
          {archive.slice().reverse().map((it) => (
            <div key={it.id} className="flex flex-wrap items-center gap-2 rounded-xl border border-slate-800 bg-slate-900 p-3">
              <div className="min-w-0 flex-1"><div className="truncate font-bold">{it.name}</div><div className="text-xs text-slate-400">{new Date(it.date).toLocaleDateString("it-IT")} · {(it.data.actions || []).length} azioni · {(it.data.rallies || []).length} scambi</div></div>
              <button onClick={() => loadArchive(it)} className="rounded-lg bg-sky-600 px-3 py-2 text-sm font-semibold">Carica</button>
              <button onClick={() => { if (window.confirm("Eliminare dall'archivio?")) setArchive((a) => a.filter((x) => x.id !== it.id)); }} className="rounded-lg bg-slate-800 px-3 py-2 text-sm text-rose-400">Elimina</button>
            </div>
          ))}
        </section>
      )}

      {toast && (
        <div className="fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-full bg-slate-100 px-5 py-3 text-sm font-semibold text-slate-950 shadow-lg">{toast}</div>
      )}
    </div>
  );
}

/* ================= VISTA ATLETA (#report=...) ================= */
const FILTERS = [
  { key: "all", label: "Tutte" },
  { key: "#", label: "Punti #" },
  { key: "+", label: "Positivi +" },
  { key: "-", label: "Negativi -" },
  { key: "/", label: "Murati /" },
  { key: "=", label: "Errori =" },
];
const RESULT_BADGE = {
  "#": "bg-emerald-500 text-emerald-950",
  "+": "bg-sky-500 text-sky-950",
  "-": "bg-amber-400 text-amber-950",
  "/": "bg-violet-500 text-violet-950",
  "=": "bg-rose-500 text-rose-950",
};

function ReportError() {
  return (
    <div className="flex min-h-screen flex-col items-center justify-center gap-3 bg-slate-950 p-6 text-center text-slate-100">
      <h1 className="text-2xl font-bold">Link non valido</h1>
      <p className="max-w-sm text-slate-400">Questa pagella non si apre: il link è incompleto o è stato modificato. Chiedi al tuo allenatore di inviartelo di nuovo.</p>
    </div>
  );
}

function AthleteView({ data, onSwitch }) {
  const { number, name, role, voto, forza, consiglio, videoId, actions, kpi } = data;
  const [filter, setFilter] = useState("all");
  const [activeId, setActiveId] = useState(null);
  const [clipStart, setClipStart] = useState(0);
  const [clipPlayNonce, setClipPlayNonce] = useState(0);

  const stat = computeStats(actions.map((a) => ({ ...a, number, name, role })))[0];
  const visible = filter === "all" ? actions : actions.filter((a) => a.result === filter);
  const countOf = (k) => (k === "all" ? actions.length : actions.filter((a) => a.result === k).length);

  useEffect(() => { document.title = "Pagella " + name + " - VolleyScout"; }, [name]);

  const playClip = (a) => {
    setActiveId(a.id);
    setClipStart(Math.max(0, Math.floor(a.time || 0)));
    setClipPlayNonce((n) => n + 1);
  };

  const embedSrc = videoId
    ? `https://www.youtube.com/embed/${videoId}?start=${clipStart}&autoplay=${clipPlayNonce > 0 ? 1 : 0}&playsinline=1&rel=0&modestbranding=1`
    : "";

  const hasGrade = typeof voto === "number";

  return (
    <div className="min-h-screen bg-slate-950 pb-10 text-slate-100">
      <div className="mx-auto max-w-2xl">
        {/* Intestazione atleta */}
        <header className="border-b border-slate-800 bg-slate-900 px-4 pb-5 pt-5">
          <div className="flex items-center justify-between gap-2">
            <p className="flex items-center gap-2 text-sm font-semibold text-orange-400">
              <Film className="h-4 w-4" /> Pagella della partita
            </p>
            {onSwitch && <button onClick={onSwitch} className="rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700">👤 Cambia Giocatore</button>}
          </div>
          <div className="mt-4 flex items-center gap-3">
            <div className="flex h-20 w-20 shrink-0 items-center justify-center rounded-2xl bg-orange-500 text-5xl font-black text-slate-950">{number}</div>
            <div className="min-w-0 flex-1">
              <h1 className="break-words text-2xl font-extrabold leading-tight">{name}</h1>
              <p className="mt-1 text-slate-400">{role}</p>
            </div>
            <div className={`flex shrink-0 flex-col items-center rounded-2xl px-4 py-2 ${hasGrade ? gradeColor(voto) : "border border-dashed border-slate-600 text-slate-400"}`}>
              <span className="text-xs font-semibold">Voto</span>
              <span className="text-5xl font-black leading-none">{hasGrade ? voto.toFixed(1) : "–"}</span>
            </div>
          </div>
        </header>

        <main className="space-y-4 p-4">
          {/* Commenti AI */}
          {forza && (
            <section className="rounded-xl border-l-4 border-emerald-500 bg-emerald-950/50 p-4">
              <h2 className="font-bold text-emerald-300">Punto di forza</h2>
              <p className="mt-1 text-slate-100">{forza}</p>
            </section>
          )}
          {consiglio && (
            <section className="rounded-xl border-l-4 border-orange-400 bg-orange-950/40 p-4">
              <h2 className="font-bold text-orange-300">Consiglio tecnico</h2>
              <p className="mt-1 text-slate-100">{consiglio}</p>
            </section>
          )}

          {kpi && kpi.n > 0 && (
            <section className="rounded-xl border border-slate-800 bg-slate-900 p-4">
              <h2 className="mb-3 text-lg font-bold">KPI avanzati</h2>
              <div className="grid grid-cols-3 gap-2 text-center">
                {(kpi.setter ? [["TPI", "N/A (Regia)"], ["Qualità Regia (# + +)", pctTxt(kpi.qr)], ["Conv. Punti su Alzata", pctTxt(kpi.conv)]] : [["TPI", pctTxt(kpi.tpi)]]).concat([["Saldo ±", (kpi.net > 0 ? "+" : "") + kpi.net], ["Ball Retention", pctTxt(kpi.ret)], ["Punti/Set", kpi.pps], ["Resilienza", pctTxt(kpi.res)], ["Scambi", kpi.n]]).map(([l, v]) => (
                  <div key={l} className="rounded-lg bg-slate-800 p-2"><div className="text-xl font-bold">{v}</div><div className="text-xs text-slate-400">{l}</div></div>
                ))}
              </div>
            </section>
          )}
          {/* Statistiche */}
          <section className="rounded-xl border border-slate-800 bg-slate-900 p-4">
            <h2 className="mb-3 text-lg font-bold">I tuoi numeri</h2>
            {stat ? (
              <>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="rounded-lg bg-slate-800 p-2"><div className="text-2xl font-bold">{stat.total.tot}</div><div className="text-xs text-slate-400">Tocchi</div></div>
                  <div className="rounded-lg bg-slate-800 p-2"><div className="text-2xl font-bold">{pctTxt(stat.total.pos)}</div><div className="text-xs text-slate-400">Positività</div></div>
                  <div className="rounded-lg bg-slate-800 p-2"><div className="text-2xl font-bold">{pctTxt(stat.total.eff)}</div><div className="text-xs text-slate-400">Efficienza</div></div>
                </div>
                <div className="mt-3 overflow-x-auto">
                  <table className="w-full min-w-[420px] text-sm">
                    <thead className="text-slate-400">
                      <tr className="text-right">
                        <th className="p-1 text-left">Fondamentale</th><th className="p-1">Tot</th><th className="p-1">#</th><th className="p-1">+</th><th className="p-1">-</th><th className="p-1 text-violet-400">/</th><th className="p-1">=</th><th className="p-1">Pos</th><th className="p-1">Eff</th>
                      </tr>
                    </thead>
                    <tbody>
                      {stat.skills.map((s) => (
                        <tr key={s.skill} className="border-t border-slate-800 text-right tabular-nums">
                          <td className="p-1 text-left font-semibold">{s.skill}</td>
                          <td className="p-1">{s.tot}</td>
                          <td className="p-1 text-emerald-400">{s["#"]}</td>
                          <td className="p-1 text-sky-400">{s["+"]}</td>
                          <td className="p-1 text-amber-400">{s["-"]}</td>
                <td className="p-1 text-violet-400">{s["/"]}</td>
                          <td className="p-1 text-rose-400">{s["="]}</td>
                          <td className="p-1">{pctTxt(s.pos)}</td>
                          <td className="p-1">{pctTxt(s.eff)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <p className="mt-2 text-xs text-slate-500"># punto o perfetta · + positiva · - negativa · / murato o merito avversario (peso −0,5) · = errore (peso −1)</p>
              </>
            ) : (
              <p className="text-slate-400">Nessuna azione registrata per questa partita.</p>
            )}
          </section>

          {/* Video e clip */}
          <section>
            <h2 className="mb-2 text-lg font-bold">Rivedi le tue azioni</h2>
            {videoId ? (
              <div className="sticky top-0 z-20 -mx-4 bg-black sm:mx-0 sm:overflow-hidden sm:rounded-xl">
                <div className="relative aspect-video">
                  <iframe
                    key={`${videoId}-${clipStart}-${clipPlayNonce}`}
                    src={embedSrc}
                    title="Video azioni"
                    className="h-full w-full border-0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerPolicy="strict-origin-when-cross-origin"
                    allowFullScreen
                  />
                </div>
                <div className="flex items-center justify-between bg-slate-900/95 px-3 py-1.5 text-xs text-slate-400">
                  <span>Tocca un'azione sotto per saltare al momento</span>
                  <a href={`https://youtu.be/${videoId}?t=${clipStart}`} target="_blank" rel="noopener noreferrer" className="font-semibold text-orange-400 hover:underline">
                    Apri su YouTube ↗
                  </a>
                </div>
              </div>
            ) : (
              <p className="rounded-xl bg-slate-900 p-4 text-slate-400">Per questa partita non è collegato nessun video. Qui sotto trovi comunque l'elenco delle tue azioni.</p>
            )}

            <div className="mt-3 flex gap-2 overflow-x-auto pb-1">
              {FILTERS.map((f) => (
                <button
                  key={f.key}
                  onClick={() => setFilter(f.key)}
                  className={`shrink-0 rounded-full px-4 py-2 text-sm font-semibold ${filter === f.key ? "bg-orange-500 text-slate-950" : "bg-slate-800 text-slate-200"}`}
                >
                  {f.label} ({countOf(f.key)})
                </button>
              ))}
            </div>

            <ul className="mt-3 space-y-2">
              {visible.length === 0 && <li className="rounded-lg bg-slate-900 p-4 text-center text-slate-400">Nessuna clip in questa categoria.</li>}
              {visible.map((a) => (
                <li key={a.id} className="flex items-stretch gap-2">
                  <button
                    onClick={() => playClip(a)}
                    disabled={!videoId}
                    className={`flex min-h-[52px] flex-1 items-center gap-3 rounded-xl border px-3 py-2 text-left disabled:opacity-60 ${activeId === a.id ? "border-orange-400 bg-slate-800" : "border-slate-800 bg-slate-900 hover:bg-slate-800"}`}
                  >
                    <Play className="h-4 w-4 shrink-0 text-orange-400" />
                    <span className="font-mono text-base tabular-nums text-orange-300">{fmt(a.time)}</span>
                    <span className="flex-1 font-semibold">{a.skill}</span>
                    <span className={`flex h-8 w-8 items-center justify-center rounded-lg text-lg font-black ${RESULT_BADGE[a.result]}`}>{a.result}</span>
                  </button>
                  {videoId && (
                    <a
                      href={`https://youtu.be/${videoId}?t=${Math.floor(a.time)}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      title="Apri direttamente su YouTube"
                      className="flex items-center justify-center rounded-xl border border-slate-800 bg-slate-900 px-3 text-xs font-bold text-slate-300 hover:border-orange-400 hover:text-orange-300"
                    >
                      YT ↗
                    </a>
                  )}
                </li>
              ))}
            </ul>
            {videoId && <p className="mt-2 text-xs text-slate-500">Ogni clip parte 3 secondi prima dell'azione.</p>}
          </section>
        </main>
      </div>
    </div>
  );
}

/* ================= APP: vista allenatore o vista atleta ================= */
function App() {
  const [hash, setHash] = useState(() => window.location.hash);
  const [cloudView, setCloudView] = useState({ loading: false, kind: null, data: null });

  useEffect(() => {
    const onHash = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    let cancelled = false;
    const h = hash || "";
    if (h.startsWith("#m=")) {
      const code = decodeURIComponent(h.slice(3)).trim();
      setCloudView({ loading: true, kind: "match", data: null });
      loadShortPayload("mat", code).then((payload) => {
        if (cancelled) return;
        setCloudView({ loading: false, kind: "match", data: payload ? parseMatchObj(payload) : { error: true } });
      });
    } else if (h.startsWith("#r=")) {
      const code = decodeURIComponent(h.slice(3)).trim();
      setCloudView({ loading: true, kind: "report", data: null });
      loadShortPayload("rep", code).then((payload) => {
        if (cancelled) return;
        setCloudView({ loading: false, kind: "report", data: payload ? parseReportObj(payload) : { error: true } });
      });
    } else {
      setCloudView({ loading: false, kind: null, data: null });
    }
    return () => { cancelled = true; };
  }, [hash]);

  if ((hash || "").startsWith("#m=") || (hash || "").startsWith("#r=")) {
    if (cloudView.loading) {
      return (
        <div className="flex min-h-screen flex-col items-center justify-center gap-3 bg-slate-950 p-6 text-center text-slate-100">
          <div className="h-8 w-8 animate-spin rounded-full border-4 border-orange-500 border-t-transparent" />
          <p className="text-sm text-slate-400">Caricamento pagella in corso…</p>
        </div>
      );
    }
    if (!cloudView.data || cloudView.data.error) return <ReportError />;
    return cloudView.kind === "match"
      ? <MatchView key={hash} data={cloudView.data} />
      : <AthleteView key={hash} data={cloudView.data} />;
  }

  const match = readMatchHash();
  if (match) return match.error ? <ReportError /> : <MatchView key={hash} data={match} />;
  const report = readReportHash();
  if (report) return report.error ? <ReportError /> : <AthleteView key={hash} data={report} />;
  return <VolleyScout />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
