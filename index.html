/* Estrae l'ID video da qualsiasi formato di link YouTube (o da un ID nudo). */
function extractVideoId(input) {
  if (!input) return null;
  const raw = input.trim();
  if (/^[\w-]{11}$/.test(raw)) return raw;
  let url;
  try {
    url = new URL(/^https?:\/\//i.test(raw) ? raw : "https://" + raw);
  } catch {
    return null;
  }
  const host = url.hostname.replace(/^(www\.|m\.|music\.)/, "");
  let id = null;
  if (host === "youtu.be") {
    id = url.pathname.split("/")[1];
  } else if (host === "youtube.com" || host === "youtube-nocookie.com") {
    if (url.pathname === "/watch") id = url.searchParams.get("v");
    else {
      const m = url.pathname.match(/^\/(embed|shorts|live|v|e)\/([\w-]{11})/);
      if (m) id = m[2];
    }
  }
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}

const fmt = (s) => {
  const t = Math.max(0, Math.floor(s || 0));
  return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
};

/* ================= LINK PAGELLA (Base64 URL-safe, UTF-8) ================= */
function toBase64Url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromBase64Url(b64) {
  let s = b64.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* Legge #report=... Restituisce null (nessun report), {error:true} (link rotto) o i dati. */

/* lineup[i] = giocatore in Zona i+1. Il Libero sostituisce i "partner" in seconda linea (Z1, Z5, Z6). */
function effLineup(g) {
  const base = g.lineup.length === 6 ? g.lineup.slice() : [null, null, null, null, null, null];
  const L = g.libero || {};
  const eff = base.slice();
  let libIdx = -1;
  if (L.id && !base.includes(L.id) && g.libMan !== "out") {
    const ok = (i) => (L.partners || []).includes(base[i]) && !(i === 0 && g.serving && L.mode === "after");
    const f = [5, 4, 0].find(ok);
    libIdx = f === undefined ? -1 : f;
    if (libIdx < 0 && g.libMan === "in") libIdx = 5;
  }
  if (libIdx >= 0) eff[libIdx] = L.id;
  return { base, eff, libIdx };
}

  return out.sort((a, b) => a.number - b.number);
}

function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= STATISTICHE & REPORT ================= */
const ROLE_FOCUS = {
  Palleggiatore: "Qualità/Efficienza di Alzata (peso maggiore), Difesa, Battuta, Saldo ± e rendimento nelle rotazioni P1–P6 (NIENTE TPI, niente Muro)",
  Schiacciatore: "Attacco (peso maggiore), Ricezione, Battuta, Difesa",
  Opposto: "Attacco (peso maggiore), Battuta, Muro",
  Centrale: "Attacco, Muro, Battuta (Ricezione e Difesa non contano)",
  Libero: "SOLO Ricezione e Difesa (Attacco, Battuta, Muro e Alzata non contano)",
};

const emptyCounts = () => ({ "#": 0, "+": 0, "-": 0, "/": 0, "=": 0, tot: 0 });
const isSetter = (role) => String(role || "").trim().toLowerCase() === "palleggiatore";
const pct = (n, d) => (d ? Math.round((n / d) * 100) : null);
const derive = (c) => ({ ...c, pos: pct(c["#"] + c["+"], c.tot), eff: pct(c["#"] - c["="] - 0.5 * c["/"], c.tot) });
const pctTxt = (v) => (v === null ? "–" : v + "%");

function computeStats(actions) {
  const map = new Map();
  actions.forEach((a) => {
    const key = a.number + "|" + a.name;
    if (!map.has(key)) map.set(key, { key, number: a.number, name: a.name, role: a.role, raw: {}, total: emptyCounts(), actions: [] });
    const p = map.get(key);
    p.role = a.role;
    if (!p.raw[a.skill]) p.raw[a.skill] = emptyCounts();
    [p.raw[a.skill], p.total].forEach((c) => { c[a.result] += 1; c.tot += 1; });
    p.actions.push(a);
  });
  return Array.from(map.values())
    .map((p) => ({
      ...p,
      skills: SKILLS.filter((s) => p.raw[s]).map((s) => ({ skill: s, ...derive(p.raw[s]) })),
      total: derive(p.total),
    }))
    .sort((a, b) => a.number - b.number);
}

function computeKpi(rallies, actions) {
  const rot = {};
  for (let i = 1; i <= 6; i++) rot[i] = { n: 0, w: 0, l: 0, soN: 0, soW: 0, bpN: 0, bpW: 0 };
  const pl = {};
  const P = (k) => pl[k] || (pl[k] = { n: 0, net: 0, sets: new Set(), tN: 0, tW: 0, tS: 0, alN: 0, alW: 0 });
  rallies.forEach((r) => {
    const x = rot[r.rot] || rot[1];
    x.n++; r.won ? x.w++ : x.l++;
    if (r.serving) { x.bpN++; if (r.won) x.bpW++; } else { x.soN++; if (r.won) x.soW++; }
    r.lineup.forEach((k) => { const p = P(k); p.n++; p.net += r.won ? 1 : -1; p.sets.add(r.set); });
    const by = {};
    actions.forEach((a) => {
      if (a.rallyId !== r.id) return;
      const o = by[a.number + "|" + a.name] || (by[a.number + "|" + a.name] = { e: false, m: false, al: false });
      if (a.result === "=") o.e = true;
      if (a.result === "/") o.m = true;
      if (a.skill === "Alzata" && (a.result === "#" || a.result === "+")) o.al = true;
    });
    Object.keys(by).forEach((k) => {
      const p = P(k), o = by[k];
      p.tN++; if (r.won) p.tW++;
      p.tS += r.won ? 1 : o.e ? -1 : o.m ? -0.5 : 0; /* scambio perso: = pesa -1, / pesa -0,5 */
      if (o.al) { p.alN++; if (r.won) p.alW++; }
    });
  });
  return { rot, pl };
}
function playerKpi(p, k) {
  k = k || { n: 0, net: 0, sets: new Set(), tN: 0, tW: 0, tS: 0, alN: 0, alW: 0 };
  const pts = p.actions.filter((a) => a.result === "#" && ["Attacco", "Battuta", "Muro"].includes(a.skill)).length;
  /* Resilienza: si attiva dopo = o -; i "/" sono ignorati; recupero = azione successiva # o + */
  const sorted = p.actions.filter((a) => a.result !== "/").sort((a, b) => a.time - b.time);
  let errs = 0, ok = 0;
  sorted.forEach((a, i) => { if ((a.result === "=" || a.result === "-") && sorted[i + 1]) { errs++; if (sorted[i + 1].result === "#" || sorted[i + 1].result === "+") ok++; } });
  const setter = isSetter(p.role), al = (p.skills || []).find((s) => s.skill === "Alzata");
  return {
    n: k.n, setEq: (k.n / SET_EQ).toFixed(1), setter, tpi: setter ? null : pct(k.tS, k.tN), qr: al ? al.pos : null, conv: pct(k.alW, k.alN), net: k.net,
    ret: pct(p.total.tot - p.total["="], p.total.tot),
    pps: (pts / Math.max(1, k.sets.size)).toFixed(1), res: pct(ok, errs),
  };
}
const kpiTxt = (v) => "Minutaggio " + v.n + " scambi, TPI " + pctTxt(v.tpi) + ", Saldo " + (v.net > 0 ? "+" : "") + v.net;

function playerDataText(p) {
  const parts = p.skills.map(
    (s) => `${s.skill} ${s.tot} (#${s["#"]} +${s["+"]} -${s["-"]} =${s["="]}, pos ${pctTxt(s.pos)}, eff ${pctTxt(s.eff)})`
  );
  return `n.${p.number} ${p.name} | ${p.role} | tocchi ${p.total.tot} | ${parts.join("; ")}`;
}

/* Solo il riepilogo numerico aggregato per giocatore: mai l'elenco grezzo delle azioni. */
function matchDataText(stats) {
  const roles = Array.from(new Set(stats.map((p) => p.role)));
  return [
    "LEGENDA: # = punto/perfetta, + = positiva, - = negativa, = = errore. Pos = (# + +) / tot. Eff = (# - =) / tot.",
    "FONDAMENTALI CHE CONTANO PER RUOLO:",
    roles.map((r) => `- ${r}: ${ROLE_FOCUS[r] || "tutti"}`).join("\n"),

    L.push("  Statistiche: " + (p.skills.length ? p.skills.map((s) => `${s.skill} ${s.tot} (#${s["#"]} +${s["+"]} -${s["-"]} =${s["="]}, Pos ${pctTxt(s.pos)}, Eff ${pctTxt(s.eff)})`).join("; ") : "nessuna azione taggata"));
    L.push(`  Murati / Merito Avversario (/): ${p.total["/"]} | Errori diretti (=): ${p.total["="]}  [i / NON penalizzano il voto]`);
    const rest = `Net ± ${v.net > 0 ? "+" : ""}${v.net} | Ball Retention ${pctTxt(v.ret)} | Punti/Set ${v.pps} | Resilienza ${pctTxt(v.res)}`;
    L.push("  KPI: " + (v.setter ? `Qualità Regia (# + +) ${pctTxt(v.qr)} | Conversione Punti su Alzata ${pctTxt(v.conv)} | ` : `TPI ${pctTxt(v.tpi)} | `) + rest);
    if (v.setter) {

  });
  L.push("", 'Rispondi ESCLUSIVAMENTE con un JSON valido (nessun testo extra, nessun markdown), usando come chiave l\'ID indicato tra [ID ...]:', '{ "ID_GIOCATORE": { "voto": 7.5, "forza": "...", "consiglio": "..." } }');
  return L.join("\n");
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext !== false) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

    }
    const mount = document.createElement("div");
    hostRef.current.innerHTML = "";
    hostRef.current.appendChild(mount);
    playerRef.current = new window.YT.Player(mount, {
      videoId,
      width: "100%",
      height: "100%",
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
      events: {
        onReady: () => setPlayerReady(true),
        onStateChange: (e) => setPlaying(e.data === window.YT.PlayerState.PLAYING),
        onError: () =>
          setUrlError("Il video non è disponibile o non può essere incorporato. Prova con un altro link."),
      },
    });
  }, [apiReady, videoId]);

  useEffect(() => () => {
    try { playerRef.current && playerRef.current.destroy(); } catch {}
  }, []);

  /* --- Aggiornamento tempo corrente --- */
  useEffect(() => {
    if (!playerReady) return;
    const t = setInterval(() => {
      try { setNow(playerRef.current.getCurrentTime() || 0); } catch {}
    }, 250);
    return () => clearInterval(t);
  }, [playerReady]);

  const loadVideo = (e) => {
    e && e.preventDefault();
    const id = extractVideoId(urlInput);
    if (!id) {
      setUrlError("Link non riconosciuto. Incolla un URL tipo youtube.com/watch?v=… o youtu.be/…");
      return;
    }
    setUrlError("");
    setVideoId(id);
  };

  /* --- Controlli player --- */
  const togglePlay = useCallback(() => {
    const p = playerRef.current;
    if (!p || !p.getPlayerState) return;
    p.getPlayerState() === window.YT.PlayerState.PLAYING ? p.pauseVideo() : p.playVideo();
  }, []);

  const skip = useCallback((delta) => {
    const p = playerRef.current;
    if (!p || !p.getCurrentTime) return;
    p.seekTo(Math.max(0, p.getCurrentTime() + delta), true);
  }, []);

  const changeSpeed = (r) => {
    setSpeed(r);
    try { playerRef.current.setPlaybackRate(r); } catch {}
  };

  const jumpTo = (t) => {
    const p = playerRef.current;
    if (!p || !p.seekTo) return;
    p.seekTo(t, true);
    p.playVideo();
  };

  /* --- Scorciatoie da tastiera --- */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (["input", "select", "textarea"].includes(tag)) return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); skip(-3); }
      else if (e.key === "ArrowRight") { e.preventDefault(); skip(3); }
      else if (e.key === "s" || e.key === "S") { setFlagNext((v) => !v); }
      else if (e.key === "Escape") { setSelPlayer(null); setSelSkill(null); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [togglePlay, skip]);

  /* --- Tagging --- */
  const commitTag = (result) => {
    if (!selPlayer || !selSkill) return;
    const p = playerRef.current;
    let t = 0;
    try { t = p && p.getCurrentTime ? p.getCurrentTime() : 0; } catch {}
    const time = Math.max(0, Math.floor(t - LEAD_SECONDS));
    const player = roster.find((r) => r.id === selPlayer);
    if (!player) return;
    setActions((a) => [
      ...a,
      {
        id: nextId.current++,
        time,
        number: player.number,
        name: player.name,
        role: player.role,
        skill: selSkill,
        result,
        aiFlag: flagNext,
        set: game.set,
        rot: game.rot,
        rallyId: null,
      },
    ]);
    setFlash(`#${player.number} ${selSkill} ${result} @ ${fmt(time)}`);
    setTimeout(() => setFlash(""), 1800);
    setSelSkill(null);
    setFlagNext(false);
  };
  const toggleFlag = (id) => setActions((as) => as.map((a) => (a.id === id ? { ...a, aiFlag: !a.aiFlag } : a)));

  const deleteAction = (id) => setActions((a) => a.filter((x) => x.id !== id));

  /* --- Roster --- */
  const addPlayer = (e) => {
    e.preventDefault();
    if (newP.number === "" || !newP.name.trim()) return;
    setRoster((r) => [...r, { id: nextId.current++, number: Number(newP.number), name: newP.name.trim(), role: newP.role }]);
    setNewP({ number: "", name: "", role: newP.role });
  };
  const updatePlayer = (id, patch) =>
    setRoster((r) => r.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const removePlayer = (id) => {
    setRoster((r) => r.filter((p) => p.id !== id));
    if (selPlayer === id) setSelPlayer(null);
  };

  /* --- Export --- */
  const exportJSON = () =>
    download(
      "scouting-partita.json",
      JSON.stringify({ videoId, exportedAt: new Date().toISOString(), actions: actions.map((a) => ({ ...a, timestamp: fmt(a.time) })) }, null, 2),
      "application/json"
    );
  const exportCSV = () => {
    const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const rows = [["Timestamp", "Secondi", "Maglia", "Giocatore", "Ruolo", "Fondamentale", "Esito"]]
      .concat(actions.map((a) => [fmt(a.time), a.time, a.number, a.name, a.role, a.skill, a.result]));
    download("scouting-partita.csv", "\ufeff" + rows.map((r) => r.map(esc).join(";")).join("\n"), "text/csv;charset=utf-8");
  };

  const stats = computeStats(actions);

  const showToast = (msg, ms = 2200) => { setToast(msg); setTimeout(() => setToast(""), ms); };

  const copyWithToast = async (text, okMsg, ms) => {
    const ok = await copyText(text);
    showToast(ok ? okMsg : "Copia non riuscita: seleziona e copia manualmente.", ok ? ms : 2200);
  };
  const copyPlayerLink = (p) => {
    const link = buildReportLink(p, reports[p.key], videoId);
    if (window.location.protocol === "file:") {
      copyWithToast(link, "Link copiato, ma questo file è locale: pubblica index.html online perché i giocatori possano aprirlo.", 5000);
    } else {
      copyWithToast(link, `Link pagella di ${p.name} copiato.`);
    }
  };
  /* Cancella solo la partita corrente: restano roster, URL video e API key. */
  const resetMatch = () => {
    if (!window.confirm("Vuoi davvero azzerare la partita?\n\nVerranno cancellate tutte le azioni taggate, i set vinti, gli scambi e le pagelle.\nRoster e link video restano salvati.")) return;
    setActions([]); setReports({}); setReportCount(0); setRallies([]);
    setGame((g) => ({ ...g, set: 1, setsWon: [0, 0] }));
    setSelPlayer(null); setSelSkill(null); setFlash(""); setPasteMsg(null);
    showToast("Partita azzerata.");
  };
  const kpiData = computeKpi(rallies, actions);
  const kpiRow = (p) => playerKpi(p, kpiData.pl[p.key]);
  const ps = fullStats(roster, stats, kpiData);

  /* --- Zero-API: copia dati+prompt -> incolla JSON di Claude --- */
  const copyForChatAI = () => copyWithToast(buildPrompt(ps, kpiData.rot, kpiRow, rallies), "Dati e prompt copiati: incollali su Claude e riporta qui il JSON.", 3500);
  const applyReports = () => {
    try {
      const clean = pasteText.replace(/```json|```/gi, "").trim();
      let obj;
      try { obj = JSON.parse(clean); } catch (e) { const m = clean.match(/[\[{][\s\S]*[\]}]/); obj = JSON.parse(m ? m[0] : ""); }
      const entries = Array.isArray(obj) ? obj.map((o) => [o && (o.id != null ? o.id : o.numero != null ? o.numero : o.nome), o]) : Object.entries(obj);
      const next = {};
      let ok = 0;
      entries.forEach(([k, o]) => {
        if (!o || typeof o !== "object") return;
        const ks = String(k).trim();
        const r = roster.find((x) => String(x.id) === ks) || roster.find((x) => x.name.toLowerCase() === ks.toLowerCase()) || roster.find((x) => String(x.number) === ks.replace(/\D/g, ""));
        const v = parseFloat(String(o.voto).replace(",", "."));
        if (!r || isNaN(v)) return;
        next[r.number + "|" + r.name] = { voto: Math.round(Math.min(10, Math.max(1, v)) * 10) / 10, forza: String(o.forza || ""), consiglio: String(o.consiglio || ""), clips: 0 };
        ok++;
      });
      if (!ok) throw new Error("nessun giocatore riconosciuto");
      setReports((prev) => ({ ...prev, ...next }));
      setReportCount(actions.length);
      setPasteText("");
      setPasteMsg({ type: "ok", text: ok + " pagelle applicate e salvate." });
    } catch (e) {
      setPasteMsg({ type: "err", text: "JSON non valido: " + (e.message || "controlla la risposta di Claude") });
    }
  };
  const copyMatchLink = () => {
    const link = buildMatchLink(ps, reports, kpiRow, videoId);
    if (window.location.protocol === "file:") copyWithToast(link, "Link copiato, ma questo file è locale: pubblica index.html online perché la squadra possa aprirlo.", 5000);
    else copyWithToast(link, "Link partita per la squadra copiato.");
  };

  /* --- Esporta / importa partita (telefono <-> PC) --- */
  const exportMatch = () => download("partita-volleyscout.json", JSON.stringify({ app: "VolleyScout", type: "match", version: 3, exportedAt: new Date().toISOString(), data: snapshot() }, null, 2), "application/json");
  /* --- Cloud Supabase: salva / carica l'intero stato (partita, roster, formazione, pagelle, archivio) --- */
  const hhmm = (d) => new Date(d).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const cloudErr = (e) => {
    const m = String((e && e.message) || e || "");
    if (/failed to fetch|network|load failed/i.test(m)) return "Nessuna connessione: i dati restano salvati in locale.";
    if (e && (e.code === "42501" || /row-level security|permission denied/i.test(m))) return "Supabase ha negato l'accesso (controlla le policy RLS di volley_sync).";
    if (e && (e.code === "42P01" || /does not exist|schema cache/i.test(m))) return "Tabella volley_sync non trovata su Supabase.";
    return "Errore cloud: " + m.slice(0, 120);
  };
  const saveCloud = async () => {
    if (!supabaseClient) { setCloud({ type: "err", text: "Libreria Cloud non caricata: serve connessione." }); return; }
    setCloud({ type: "busy", text: "Salvataggio in corso…" });
    try {
      const now = new Date().toISOString();
      const { error } = await supabaseClient.from(CLOUD_TABLE).upsert({ id: CLOUD_ID, data: { app: "VolleyScout", version: 4, savedAt: now, current: snapshot(), archive }, updated_at: now });
      if (error) throw error;
      setCloud({ type: "ok", text: "Salvato alle " + hhmm(now) });
    } catch (e) { setCloud({ type: "err", text: cloudErr(e) }); }
  };
  const loadCloud = async () => {
    if (!supabaseClient) { setCloud({ type: "err", text: "Libreria Cloud non caricata: serve connessione." }); return; }
    setCloud({ type: "busy", text: "Caricamento in corso…" });
    try {
      const { data: row, error } = await supabaseClient.from(CLOUD_TABLE).select("data, updated_at").eq("id", CLOUD_ID).maybeSingle();
      if (error) throw error;
      if (!row || !row.data || !row.data.current) { setCloud({ type: "err", text: "Nessun salvataggio trovato sul cloud." }); return; }
      const when = new Date(row.updated_at || row.data.savedAt || Date.now());
      if ((actions.length || rallies.length) && !window.confirm("Caricare il salvataggio cloud del " + when.toLocaleString("it-IT") + "?\n\nLa partita, il roster e le pagelle su questo dispositivo verranno sovrascritti (l'archivio viene sostituito con quello cloud).")) { setCloud({ type: "", text: "" }); return; }
      const d = row.data.current;
      const rs = d.roster && d.roster.length ? d.roster : roster;
      const n = { urlInput: d.urlInput || "", videoId: d.videoId || null, roster: rs, actions: d.actions || [], reports: d.reports || {}, reportCount: d.reportCount || 0, game: mkGame(d.game), rallies: d.rallies || [] };
      const arch = Array.isArray(row.data.archive) ? row.data.archive : archive;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(n)); localStorage.setItem(ARCH_KEY, JSON.stringify(arch)); } catch (e) {}
      setUrlInput(n.urlInput); setVideoId(n.videoId); setRoster(n.roster); setActions(n.actions); setReports(n.reports);
      setReportCount(n.reportCount); setGame(n.game); setRallies(n.rallies); setArchive(arch);
      setSelPlayer(null); setSelSkill(null); setSelZone(null);
      nextId.current = Math.max(nextId.current, ...n.actions.map((x) => Number(x.id) || 0), ...n.rallies.map((x) => Number(x.id) || 0), ...rs.map((x) => Number(x.id) || 0)) + 1;
      setCloud({ type: "ok", text: "Caricato il salvataggio cloud del " + when.toLocaleDateString("it-IT") + " alle " + hhmm(when) });
    } catch (e) { setCloud({ type: "err", text: cloudErr(e) }); }
  };
  const importMatch = (file) => {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const j = JSON.parse(fr.result);
        const d = j.data || j.current || j;
        if (!d || !Array.isArray(d.actions)) throw new Error("formato");
        if (actions.length && !window.confirm("Importare la partita? Quella corrente verrà sostituita (salvala prima in archivio se serve).")) return;
        const rs = d.roster && d.roster.length ? d.roster : roster;
        setUrlInput(d.urlInput || ""); setVideoId(d.videoId || null); setRoster(rs);
        setActions(d.actions); setReports(d.reports || {}); setReportCount(d.reportCount || 0);
        setGame(mkGame(d.game)); setRallies(d.rallies || []);
        nextId.current = Math.max(nextId.current, ...d.actions.map((x) => Number(x.id) || 0), ...(d.rallies || []).map((x) => Number(x.id) || 0), ...rs.map((x) => Number(x.id) || 0)) + 1;
        setTab("scout");
        showToast("Partita importata: ora puoi aggiungere il link YouTube.", 3500);
      } catch (e) { showToast("File partita non valido."); }
    };
    fr.readAsText(file);
  };

  /* --- Set, rotazioni, sostituzioni, chiusura scambio --- */
  const setLineupAt = (i, id) => setGame((g) => { const l = (g.lineup.length === 6 ? g.lineup : [null, null, null, null, null, null]).slice(); l[i] = id ? Number(id) : null; return { ...g, lineup: l }; });
  const rotateOnce = (g) => ({ ...g, rot: (g.rot % 6) + 1, libMan: null, lineup: g.lineup.length === 6 ? g.lineup.map((_, i, a) => a[(i + 1) % 6]) : g.lineup });
  const rotateBack = (g) => ({ ...g, rot: ((g.rot + 4) % 6) + 1, libMan: null, lineup: g.lineup.length === 6 ? g.lineup.map((_, i, a) => a[(i + 5) % 6]) : g.lineup });
  const swapZones = (a, b) => {
    setSwapFrom(null); setSelZone(null);
    if (a === b) return;
    setGame((g) => { const l = (g.lineup.length === 6 ? g.lineup : [null, null, null, null, null, null]).slice(); const t = l[a - 1]; l[a - 1] = l[b - 1]; l[b - 1] = t; return { ...g, lineup: l }; });
    showToast("Zone " + a + " e " + b + " scambiate.");
  };
  const benchToZone = (z, id) => { setLineupAt(z - 1, id); setSelZone(null); setSwapFrom(null); showToast("Sostituzione effettuata."); };
  const onZoneTap = (z) => { if (swapFrom) { swapZones(swapFrom, z); return; } setSelZone(selZone === z ? null : z); };
  const doSubZone = (z, id) => { setLineupAt(z - 1, id); setSelZone(null); showToast(id ? "Sostituzione effettuata." : "Posizione svuotata."); };
  const setLibero = (patch) => setGame((g) => ({ ...g, libero: { ...g.libero, ...patch } }));
  const togglePartner = (id) => setGame((g) => ({ ...g, libero: { ...g.libero, partners: g.libero.partners.includes(id) ? g.libero.partners.filter((x) => x !== id) : [...g.libero.partners, id] } }));
  const liberoToggle = () => setGame((g) => ({ ...g, libMan: effLineup(g).libIdx >= 0 ? "out" : "in" }));
  const closeRally = (won) => {
    const { eff } = effLineup(game);
    if (eff.filter(Boolean).length < 6) { showToast("Imposta prima i 6 giocatori in campo (tocca le zone)."); return; }
    const id = nextId.current++;
    const keys = eff.map((i) => roster.find((x) => x.id === i)).filter(Boolean).map((r) => r.number + "|" + r.name);
    setRallies((rs) => [...rs, { id, set: game.set, rot: game.rot, serving: game.serving, won, lineup: keys, rotated: won && !game.serving && game.auto }]);
    setActions((as) => as.map((a) => (a.rallyId == null ? { ...a, rallyId: id } : a)));
    setGame((g) => { const n = { ...g, serving: won }; return won && !g.serving && g.auto ? rotateOnce(n) : n; });
    showToast(won ? "Punto Noi registrato." : "Punto Avversari registrato.");
  };
  const undoRally = () => {
    const last = rallies[rallies.length - 1];
    if (!last) return;
    setRallies((rs) => rs.slice(0, -1));
    setActions((as) => as.map((a) => (a.rallyId === last.id ? { ...a, rallyId: null } : a)));
    /* ripristina battuta e, se il punto aveva fatto ruotare, la rotazione esatta di prima */
    setGame((g) => ({ ...(last.rotated ? rotateBack(g) : g), serving: last.serving, set: last.set || g.set }));
    showToast("Ultimo punto annullato" + (last.rotated ? " e rotazione ripristinata." : "."));
  };
  const setRalliesCur = rallies.filter((r) => (r.set || 1) === game.set);
  const ptsNoi = setRalliesCur.filter((r) => r.won).length;
  const ptsAvv = setRalliesCur.filter((r) => !r.won).length;
  const closeSet = () => {
    if (ptsNoi === 0 && ptsAvv === 0) { showToast("Segna almeno un punto prima di chiudere il set."); return; }
    if (ptsNoi === ptsAvv) { showToast("Il set è in parità (" + ptsNoi + "-" + ptsAvv + "): assegna prima il punto decisivo."); return; }
    const weWon = ptsNoi > ptsAvv;
    if (!window.confirm(`Chiudere il Set ${game.set} sul punteggio ${ptsNoi} - ${ptsAvv} (${weWon ? "vinto da " + game.homeName : "vinto da " + game.awayName}) e passare al Set ${Math.min(5, game.set + 1)}?`)) return;
    setGame((g) => {
      const sw = [Number(g.setsWon[0]) || 0, Number(g.setsWon[1]) || 0];
      if (weWon) sw[0] = Math.min(3, sw[0] + 1);
      else sw[1] = Math.min(3, sw[1] + 1);
      return { ...g, setsWon: sw, set: Math.min(5, g.set + 1) };
    });
    showToast(`Set ${game.set} chiuso (${ptsNoi}-${ptsAvv})! Passato al Set ${Math.min(5, game.set + 1)}.`, 3000);
  };
  const adjustSetsWon = (idx, delta) => {
    setGame((g) => {
      const sw = [Number(g.setsWon[0]) || 0, Number(g.setsWon[1]) || 0];
      sw[idx] = Math.max(0, Math.min(3, sw[idx] + delta));
      return { ...g, setsWon: sw };
    });
  };
  const editTeamName = (side) => {
    const isHome = side === "home";
    const cur = isHome ? game.homeName : game.awayName;
    const val = window.prompt(isHome ? "Nome squadra di casa (Noi):" : "Nome squadra ospite (Avversari):", cur);
    if (val === null) return;
    const clean = val.trim().toUpperCase().slice(0, 18);
    if (!clean) return;
    setGame((g) => (isHome ? { ...g, homeName: clean } : { ...g, awayName: clean }));
    showToast("Nome squadra aggiornato: " + clean);
  };

  /* --- Archivio stagione --- */
  const snapshot = () => ({ urlInput, videoId, roster, actions, reports, reportCount, game, rallies });
  const saveArchive = () => {
    const name = window.prompt("Nome partita (es. vs Pinerolo 24/11):", "Partita " + new Date().toLocaleDateString("it-IT"));
    if (!name) return;
    setArchive((a) => [...a, { id: Date.now(), name, date: new Date().toISOString(), data: snapshot() }]);
    showToast("Partita salvata in archivio.");
  };
  const loadArchive = (it) => {
    if (!window.confirm("Caricare \"" + it.name + "\"? La partita corrente verrà sostituita (salvala prima in archivio se serve).")) return;
    const d = it.data || {};
    setUrlInput(d.urlInput || ""); setVideoId(d.videoId || null); setRoster(d.roster && d.roster.length ? d.roster : roster);
    setActions(d.actions || []); setReports(d.reports || {}); setReportCount(d.reportCount || 0);
    setGame(mkGame(d.game)); setRallies(d.rallies || []);
    setTab("scout"); showToast("Partita caricata.");
  };
  const exportBackup = () => download("volleyscout-backup.json", JSON.stringify({ app: "VolleyScout", version: 2, exportedAt: new Date().toISOString(), archive, current: snapshot() }, null, 2), "application/json");
  const importBackup = (file) => {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        const list = Array.isArray(d.archive) ? d.archive : [];
        if (d.current && d.current.actions && d.current.actions.length) list.push({ name: "Backup importato", date: d.exportedAt || new Date().toISOString(), data: d.current });
        setArchive((a) => a.concat(list.map((x, i) => ({ ...x, id: Date.now() + i }))));
        showToast(list.length + " partite importate.");
      } catch (e) { showToast("File di backup non valido."); }
    };
    fr.readAsText(file);
  };
  const jumpClip = (t) => { jumpTo(t); window.scrollTo({ top: 0, behavior: "smooth" }); };

  const selected = roster.find((r) => r.id === selPlayer);
  const stepHint = !selPlayer ? "1 · Scegli il giocatore" : !selSkill ? "2 · Scegli il fondamentale" : "3 · Scegli la valutazione";
  const inputCls = "bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-400";

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100">
      {/* Header + URL */}
      <header className="border-b border-slate-800 bg-slate-900 px-4 py-3">
        <div className="mx-auto flex max-w-[1500px] flex-wrap items-center gap-3">
          <div className="flex items-center gap-2 text-lg font-bold">
            <Film className="h-6 w-6 text-orange-400" />
            VolleyScout
          </div>
          <form onSubmit={loadVideo} className="flex min-w-[260px] flex-1 gap-2">
            <div className="relative flex-1">
              <Link2 className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500" />
              <input
                value={urlInput}
                onChange={(e) => setUrlInput(e.target.value)}
                placeholder="Incolla il link YouTube della partita"
                className={`${inputCls} w-full pl-9`}
              />
            </div>
            <button className="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-slate-950 hover:bg-orange-400">
              Carica video
            </button>
          </form>
          <button onClick={resetMatch} className="flex items-center gap-2 rounded-lg border border-rose-500/60 px-3 py-2 text-sm font-semibold text-rose-300 hover:bg-rose-500 hover:text-white">

        const sal = (r) => r.w - r.l;
        const best = live.length ? live.reduce((a, b) => (sal(b) > sal(a) ? b : a)) : null;
        const worst = live.length ? live.reduce((a, b) => (sal(b) < sal(a) ? b : a)) : null;
        const th = "p-2 text-right";
        return (
          <section className="mx-auto max-w-[1500px] space-y-4 p-4">
            <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900 p-4">

                <tbody>{rows.map((r) => (
                  <tr key={r.n} className={`border-t border-slate-800 text-right ${best && r.n === best.n && sal(r) > 0 ? "bg-emerald-950/60" : ""} ${worst && r.n === worst.n && live.length > 1 ? "bg-rose-950/60" : ""}`}>
                    <td className="p-2 text-left font-bold">P{r.n}{best && r.n === best.n && live.length > 1 ? " 🏆" : ""}{worst && r.n === worst.n && live.length > 1 ? " ⚠️" : ""}</td>
                    <td className="p-2">{r.w + r.l}</td><td className="p-2">{r.w}</td><td className="p-2">{r.l}</td><td className="p-2 font-bold">{sal(r) > 0 ? "+" : ""}{sal(r)}</td>
                    <td className="p-2">{pctTxt(pct(r.soW, r.soN))}</td><td className="p-2">{pctTxt(pct(r.bpW, r.bpN))}</td>
                  </tr>))}</tbody>
              </table>
              <p className="mt-2 text-xs text-slate-400">🏆 rotazione migliore (saldo più alto) · ⚠️ più critica (saldo più basso). Side-Out: scambi vinti in ricezione. Break Point: scambi vinti al servizio.</p>
            </div>
            <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900 p-4">
              <h2 className="mb-2 text-lg font-bold">KPI individuali</h2>
              <table className="w-full min-w-[820px] text-sm tabular-nums">
                <thead className="text-slate-400"><tr><th className="p-2 text-left">Giocatore</th><th className={th}>Scambi</th><th className={th}>Set eq.</th><th className={th}>TPI %</th><th className={th}>Saldo ±</th><th className={th}>Ball Ret. %</th><th className={th}>PPS</th><th className={th}>Resil. %</th><th className={th}>Regia %</th><th className={th}>Conv. Alz. %</th></tr></thead>
                <tbody>{ps.map((p) => { const v = kpiRow(p); return (
                  <tr key={p.key} className="border-t border-slate-800 text-right">
                    <td className="p-2 text-left font-semibold">{p.number} {p.name}</td><td className="p-2">{v.n}</td><td className="p-2">{v.setEq}</td><td className="p-2">{v.setter ? "N/A (Regia)" : pctTxt(v.tpi)}</td>
                    <td className="p-2 font-bold">{v.net > 0 ? "+" : ""}{v.net}</td><td className="p-2">{pctTxt(v.ret)}</td><td className="p-2">{v.pps}</td><td className="p-2">{pctTxt(v.res)}</td><td className="p-2">{v.setter ? pctTxt(v.qr) : "–"}</td><td className="p-2">{v.setter ? pctTxt(v.conv) : "–"}</td>
                  </tr>); })}</tbody>
              </table>
              <p className="mt-2 text-xs text-slate-400">TPI: scambi con tocco del giocatore, vinti = +1, persi con suo = −1, persi con suo / −0,5 (non calcolato per il Palleggiatore). Regia %: alzate # e + sul totale alzate. Conv. Alz.: % scambi chiusi a punto dopo una sua alzata # o +. Ball Retention: tocchi senza errore (= escluso, / non conta). PPS: punti (#) in attacco/battuta/muro per set. Resilienza: % di azioni # o + subito dopo un = o un - (i / sono ignorati). Set eq. = scambi / {SET_EQ}.</p>
            </div>
          </section>
        );
      })()}
      {tab === "arch" && (
        <section className="mx-auto max-w-[1500px] space-y-3 p-4">
          <div className="flex flex-wrap gap-2">
            <button onClick={saveArchive} disabled={!actions.length} className="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-slate-950 disabled:opacity-40">💾 Salva in Archivio Stagione</button>

            <label className="cursor-pointer rounded-lg bg-slate-800 px-4 py-2 font-semibold hover:bg-slate-700">⬆️ Importa Backup JSON<input type="file" accept="application/json,.json" className="hidden" onChange={(e) => { importBackup(e.target.files[0]); e.target.value = ""; }} /></label>

            </div>
          ))}
        </section>
      )}

      {toast && (
        <div className="fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-full bg-slate-100 px-5 py-3 text-sm font-semibold text-slate-950 shadow-lg">{toast}</div>
      )}
    </div>
  );
}

function AthleteView({ data, onSwitch }) {
  const { number, name, role, voto, forza, consiglio, videoId, actions, kpi } = data;
  const [apiReady, setApiReady] = useState(false);
  const [filter, setFilter] = useState("all");
  const [activeId, setActiveId] = useState(null);
  const hostRef = useRef(null);
  const playerRef = useRef(null);
  const readyRef = useRef(false);
  const pendingRef = useRef(null);

  const stat = computeStats(actions.map((a) => ({ ...a, number, name, role })))[0];
  const visible = filter === "all" ? actions : actions.filter((a) => a.result === filter);
  const countOf = (k) => (k === "all" ? actions.length : actions.filter((a) => a.result === k).length);

  useEffect(() => { document.title = "Pagella " + name + " - VolleyScout"; }, [name]);

  useEffect(() => {
    if (!videoId) return;
    if (window.YT && window.YT.Player) { setApiReady(true); return; }
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); setApiReady(true); };
    if (!document.getElementById("yt-iframe-api")) {
      const s = document.createElement("script");
      s.id = "yt-iframe-api";
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
  }, [videoId]);

  useEffect(() => {
    if (!apiReady || !videoId || playerRef.current || !hostRef.current) return;
    const mount = document.createElement("div");
    hostRef.current.innerHTML = "";
    hostRef.current.appendChild(mount);
    playerRef.current = new window.YT.Player(mount, {
      videoId,
      width: "100%",
      height: "100%",
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
      events: {
        onReady: () => {
          readyRef.current = true;
          if (pendingRef.current !== null) {
            const t = pendingRef.current;
            pendingRef.current = null;
            try { playerRef.current.seekTo(t, true); playerRef.current.playVideo(); } catch (e) {}
          }
        },
      },
    });
  }, [apiReady, videoId]);

  useEffect(() => () => {
    try { playerRef.current && playerRef.current.destroy(); } catch (e) {}
  }, []);

  const playClip = (a) => {
    setActiveId(a.id);
    if (readyRef.current && playerRef.current) {
      try { playerRef.current.seekTo(a.time, true); playerRef.current.playVideo(); } catch (e) {}
    } else {
      pendingRef.current = a.time;
    }
  };

  const hasGrade = typeof voto === "number";

  return (
    <div className="min-h-screen bg-slate-950 pb-10 text-slate-100">
      <div className="mx-auto max-w-2xl">
        {/* Intestazione atleta */}
        <header className="border-b border-slate-800 bg-slate-900 px-4 pb-5 pt-5">
          <div className="flex items-center justify-between gap-2">
            <p className="flex items-center gap-2 text-sm font-semibold text-orange-400">
              <Film className="h-4 w-4" /> Pagella della partita
            </p>
            {onSwitch && <button onClick={onSwitch} className="rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold hover:bg-slate-700">👤 Cambia Giocatore</button>}
          </div>
          <div className="mt-4 flex items-center gap-3">
            <div className="flex h-20 w-20 shrink-0 items-center justify-center rounded-2xl bg-orange-500 text-5xl font-black text-slate-950">{number}</div>
            <div className="min-w-0 flex-1">
              <h1 className="break-words text-2xl font-extrabold leading-tight">{name}</h1>
              <p className="mt-1 text-slate-400">{role}</p>
            </div>
            <div className={`flex shrink-0 flex-col items-center rounded-2xl px-4 py-2 ${hasGrade ? gradeColor(voto) : "border border-dashed border-slate-600 text-slate-400"}`}>
              <span className="text-xs font-semibold">Voto</span>
              <span className="text-5xl font-black leading-none">{hasGrade ? voto.toFixed(1) : "–"}</span>
            </div>
          </div>
        </header>

        <main className="space-y-4 p-4">
          {/* Commenti AI */}
          {forza && (
            <section className="rounded-xl border-l-4 border-emerald-500 bg-emerald-950/50 p-4">
              <h2 className="font-bold text-emerald-300">Punto di forza</h2>
              <p className="mt-1 text-slate-100">{forza}</p>
            </section>
          )}
          {consiglio && (
            <section className="rounded-xl border-l-4 border-orange-400 bg-orange-950/40 p-4">
              <h2 className="font-bold text-orange-300">Consiglio tecnico</h2>
              <p className="mt-1 text-slate-100">{consiglio}</p>
            </section>
          )}

          {kpi && kpi.n > 0 && (
            <section className="rounded-xl border border-slate-800 bg-slate-900 p-4">
              <h2 className="mb-3 text-lg font-bold">KPI avanzati</h2>
              <div className="grid grid-cols-3 gap-2 text-center">
                {(kpi.setter ? [["TPI", "N/A (Regia)"], ["Qualità Regia (# + +)", pctTxt(kpi.qr)], ["Conv. Punti su Alzata", pctTxt(kpi.conv)]] : [["TPI", pctTxt(kpi.tpi)]]).concat([["Saldo ±", (kpi.net > 0 ? "+" : "") + kpi.net], ["Ball Retention", pctTxt(kpi.ret)], ["Punti/Set", kpi.pps], ["Resilienza", pctTxt(kpi.res)], ["Scambi", kpi.n]]).map(([l, v]) => (
                  <div key={l} className="rounded-lg bg-slate-800 p-2"><div className="text-xl font-bold">{v}</div><div className="text-xs text-slate-400">{l}</div></div>

                          <td className="p-1 text-left font-semibold">{s.skill}</td>
                          <td className="p-1">{s.tot}</td>
                          <td className="p-1 text-emerald-400">{s["#"]}</td>
                          <td className="p-1 text-sky-400">{s["+"]}</td>
                          <td className="p-1 text-amber-400">{s["-"]}</td>
                <td className="p-1 text-violet-400">{s["/"]}</td>
                          <td className="p-1 text-rose-400">{s["="]}</td>
                          <td className="p-1">{pctTxt(s.pos)}</td>
                          <td className="p-1">{pctTxt(s.eff)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <p className="mt-2 text-xs text-slate-500"># punto o perfetta · + positiva · - negativa · / murato o merito avversario (peso −0,5) · = errore (peso −1)</p>
              </>
            ) : (
              <p className="text-slate-400">Nessuna azione registrata per questa partita.</p>
            )}
          </section>

          {/* Video e clip */}
          <section>
            <h2 className="mb-2 text-lg font-bold">Rivedi le tue azioni</h2>
            {videoId ? (
              <div className="sticky top-0 z-20 -mx-4 bg-black sm:mx-0 sm:overflow-hidden sm:rounded-xl">
                <div className="relative aspect-video">
                  <div ref={hostRef} className="absolute inset-0 [&_iframe]:h-full [&_iframe]:w-full" />
                  {!apiReady && <div className="absolute inset-0 flex items-center justify-center text-sm text-slate-400">Caricamento video…</div>}
                </div>
              </div>
            ) : (
              <p className="rounded-xl bg-slate-900 p-4 text-slate-400">Per questa partita non è collegato nessun video. Qui sotto trovi comunque l'elenco delle tue azioni.</p>
            )}

            <div className="mt-3 flex gap-2 overflow-x-auto pb-1">
              {FILTERS.map((f) => (
                <button
                  key={f.key}
                  onClick={() => setFilter(f.key)}
                  className={`shrink-0 rounded-full px-4 py-2 text-sm font-semibold ${filter === f.key ? "bg-orange-500 text-slate-950" : "bg-slate-800 text-slate-200"}`}
                >
                  {f.label} ({countOf(f.key)})
                </button>
              ))}
            </div>

            <ul className="mt-3 space-y-2">
              {visible.length === 0 && <li className="rounded-lg bg-slate-900 p-4 text-center text-slate-400">Nessuna clip in questa categoria.</li>}
              {visible.map((a) => (
                <li key={a.id}>
                  <button
                    onClick={() => playClip(a)}
                    disabled={!videoId}
                    className={`flex min-h-[52px] w-full items-center gap-3 rounded-xl border px-3 py-2 text-left disabled:opacity-60 ${activeId === a.id ? "border-orange-400 bg-slate-800" : "border-slate-800 bg-slate-900 hover:bg-slate-800"}`}
                  >
                    <Play className="h-4 w-4 shrink-0 text-orange-400" />
                    <span className="font-mono text-base tabular-nums text-orange-300">{fmt(a.time)}</span>
                    <span className="flex-1 font-semibold">{a.skill}</span>
                    <span className={`flex h-8 w-8 items-center justify-center rounded-lg text-lg font-black ${RESULT_BADGE[a.result]}`}>{a.result}</span>
                  </button>
                </li>
              ))}
            </ul>
            {videoId && <p className="mt-2 text-xs text-slate-500">Ogni clip parte 3 secondi prima dell'azione.</p>}
          </section>
        </main>
      </div>
    </div>
  );
}

/* ================= APP: vista allenatore o vista atleta ================= */
function App() {
  const [hash, setHash] = useState(() => window.location.hash);
  useEffect(() => {
    const onHash = () => setHash(window.location.hash);
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const match = readMatchHash();
  if (match) return match.error ? <ReportError /> : <MatchView key={hash} data={match} />;
  const report = readReportHash();
  if (report) return report.error ? <ReportError /> : <AthleteView key={hash} data={report} />;
  return <VolleyScout />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
